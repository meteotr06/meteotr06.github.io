<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sayfa bulunamadı</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. Buradan uygulamalara ve hesaplama araçlarına ulaşabilirsiniz." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/hesap/simge.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/hesap/stil.css?v=31" />
<style>
  /* Kok 404: hesap sitesinin stilini kullaniyoruz ama ust bar olmadan */
  body { padding: 18px 16px 40px; }
  .kok-404 { max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>

<main class="kok-404">
    <div class="kutu one-cikan" style="text-align:center">
        <div class="dev-deger">404</div>
        <div class="dev-etiket">aradığınız sayfa bulunamadı</div>
        <p id="adresNotu" class="kucuk"></p>
    </div>

    <h2 class="grup-baslik">Uygulamalar</h2>
    <div class="arac-izgara" id="uygulamalar"></div>

    <h2 class="grup-baslik">Bir hesap mı arıyordunuz?</h2>
    <div class="arama-kutu" role="search">
        <label class="gorsel-gizli" for="aramaGirdi">Araç ara</label>
        <span class="arama-simge" aria-hidden="true">⌕</span>
        <input id="aramaGirdi" type="search" autocomplete="off" enterkeyhint="go"
               placeholder="maaş, kira, kredi, boya…" />
    </div>
    <p id="aramaDurum" class="kucuk arama-durum" aria-live="polite"></p>
    <div id="aracListesi"></div>
</main>

<script src="/hesap/hesap.js?v=31"></script>
<script src="/hesap/sayfa.js?v=31"></script>
<script>
const KOK = "/hesap/";

const UYGULAMALAR = [
    { ad: "Hesap Araçları", adres: "/hesap/", not: "42 hesaplama aracı ve rehber" },
    { ad: "Hava Durumu", adres: "/mobil/", not: "Saatlik ve 7 günlük" },
    { ad: "Kur Pusulası", adres: "/kur-pusulasi/", not: "Döviz, altın ve tahmin" },
    { ad: "Göz Molası", adres: "/goz-molasi/", not: "Ekran başında göz yorgunluğuna" },
    { ad: "Haftalık Planlayıcı", adres: "/planlayici/", not: "Ders ve iş programı" },
    { ad: "Muhasebe", adres: "/muhasebe/", not: "Gelir, gider, kasa ve cari" }
];

document.getElementById("uygulamalar").innerHTML = UYGULAMALAR.map(u =>
    `<a class="arac-kart" href="${u.adres}"><b>${u.ad}</b><span>${u.not}</span></a>`).join("");

// Adresten ne aradigini tahmin et
const parca = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "")
    .replace(/\.html?$/, "").replace(/[-_]+/g, " ").replace(/hesaplama/gi, "").trim();
if (parca.length > 2) {
    document.getElementById("adresNotu").innerHTML =
        `Şunu aramış olabilirsiniz: <b>${parca.replace(/[<>&]/g, "")}</b>`;
}

const liste = document.getElementById("aracListesi");
const girdi = document.getElementById("aramaGirdi");
const durum = document.getElementById("aramaDurum");

function hepsi() {
    return ARACLAR.concat((typeof REHBERLER !== "undefined" ? REHBERLER : [])
        .map(r => Object.assign({ rehberMi: true }, r)));
}
function kart(a) {
    return `<a class="arac-kart${a.rehberMi ? " rehber-kart" : ""}" href="${KOK}${a.yol}">
        <b>${a.rehberMi ? "Rehber: " : ""}${a.ad}</b><span>${a.aciklama}</span></a>`;
}
function ciz() {
    const sorgu = sadelestir(girdi.value).trim();
    if (!sorgu) { liste.innerHTML = ""; durum.textContent = ""; return; }
    const kelimeler = sorgu.split(/\s+/).filter(Boolean);
    const bulunan = hepsi().filter(a => {
        const t = sadelestir(a.ad + " " + a.aciklama + " " + (a.grup || "") + " " + (a.anahtar || ""));
        return kelimeler.every(k => t.indexOf(k) >= 0);
    }).slice(0, 12);
    liste.innerHTML = bulunan.length
        ? `<div class="arac-izgara">${bulunan.map(kart).join("")}</div>`
        : `<div class="kutu"><p class="kucuk">Sonuç yok. <a href="${KOK}">Bütün araçlara göz atın</a>.</p></div>`;
    durum.textContent = bulunan.length ? bulunan.length + " sonuç" : "Sonuç yok";
}
girdi.addEventListener("input", ciz);
if (parca.length > 2) { girdi.value = parca; ciz(); }
</script>
</body>
</html>
