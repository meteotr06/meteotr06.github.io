<script>
/* TEMA VE RENK, STİL DOSYASINDAN ÖNCE KURULUR.
   Sonra kurulsaydı sayfa önce yanlış renkte çizilir, sonra atlardı.

   Varsayılan KOYU: kavurmahane loştur. Ama telefonun ayarı AÇIK ise
   ona uyulur. Kullanıcının kendi seçimi her ikisini de yener.

   TÜRETİLEN DEĞER DİSKE YAZILMAZ -- yalnız kullanıcının SEÇİMİ yazılır.
   Yazsaydık ilk açılışta donardı ve telefon ayarı bir daha dinlenmezdi. */
(function () {
    var kok = document.documentElement;
    function secili(a) { try { return localStorage.getItem(a); } catch (e) { return null; } }
    function uygula() {
        var t = secili('kahve-tema');
        if (!t) {
            t = (window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: light)').matches)
                ? 'acik' : 'koyu';
        }
        kok.setAttribute('data-tema', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'koyu' ? '#0d0b09' : '#f5f6f8');
    }
    uygula();
    var r = secili('kahve-renk');
    if (r && r !== 'varsayilan') kok.setAttribute('data-renk', r);
    try {
        var s = window.matchMedia('(prefers-color-scheme: light)');
        var d = function () { if (!secili('kahve-tema')) uygula(); };
        if (s.addEventListener) s.addEventListener('change', d);
        else if (s.addListener) s.addListener(d);
    } catch (e) {}
})();
</script>

<script>
/* Kurulum daveti. Anahtar UYGULAMAYA OZEL -- ortak anahtar kullanilsaydi

/* SERIT METINLERI SOZLUKTEN GELIYOR.
   `kurulum.js` ORTAK bir moduldur, dokuz uygulama kullanir; dili
   modulun icine gomseydik ya hepsini Ingilizce yapardik ya da
