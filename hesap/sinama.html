<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Hesap Araçları — sınama</title>
<style>
  body{margin:0;background:#12151a;color:#e9edf2;font:14px/1.6 system-ui;padding:18px}
  h1{font-size:19px;margin:0 0 4px} h2{font-size:14px;margin:20px 0 6px;color:#9fb0c4}
  p.alt{color:#8fa0b4;margin:0 0 16px;font-size:13px}
  .s{padding:5px 10px;border-radius:6px;margin:2px 0;background:#1b2029}
  .ok{border-left:3px solid #35c08a} .yok{border-left:3px solid #e5484d;background:#2b1a1c}
  #ozet{padding:12px;border-radius:8px;margin:14px 0;font-weight:600}
  .gecti{background:#14301f;color:#7fe0b0} .kaldi{background:#301618;color:#ff9ea1}
  code{color:#c8d3e0}
</style>
</head>
<body>
<h1>Hesap Araçları — çekirdek sınaması</h1>
<p class="alt">Her madde <b>yaşanmış</b> bir hataya dayanır. Bu proje
<b>yayında</b> ve <b>para hesaplıyor</b>; hiçbir maddeyi "artık gerek yok"
diye silme — sebebi yanında yazılı.</p>
<div id="ozet">yükleniyor…</div>
<div id="liste"></div>

<script>
/* Önbellek eski kodu vermesin. 27.08.2026'da üç kez yaşandı: sayfa
   `?v=40` servis ederken diskte `?v=44` duruyordu; servis çalışanı
   `cache:"no-store"` isteğini bile eskisiyle karşıladı.
   "Sınama geçti" ile "düzeltilmiş kod sınandı" AYRI iddialardır. */
var T = Date.now();
document.write('<scr' + 'ipt src="hesap.js?t=' + T + '"><\/scr' + 'ipt>');
document.write('<scr' + 'ipt src="sayfa.js?t=' + T + '"><\/scr' + 'ipt>');
</script>

<script>
window.addEventListener("load", async function () {
  var sonuclar = [], hata = 0;
  function bas(ad) { sonuclar.push({ bolum: ad }); }
  function ol(ad, kosul, ayrinti) {
    if (!kosul) hata++;
    sonuclar.push({ ad: ad, gecti: !!kosul, ayrinti: ayrinti || "" });
  }
  function yakin(a, b, tol) { return Math.abs(a - b) < (tol === undefined ? 0.01 : tol); }

  /* ══ A · SAYI-SINAMA.md zorunlu küme ═══════════════════════════════
     Yayındaki net maaş sayfasında 170 alan `type="number"` idi:
     "33.030,00" yazıldı, tarayıcı virgülü attı, 33,03 TL okundu ve
     sonuç -4.921,47 ₺ çıktı. Çökme yok, uyarı yok — sadece yanlış. */
  bas("A · Sayı yazımı sınavı (SAYI-SINAMA.md)");
  [["1500", 1500], ["1500.50", 1500.5], ["1500,50", 1500.5], ["1.500", 1500],
   ["1.500,50", 1500.5], ["1,500.50", 1500.5], ["1 500", 1500], [" 1500 ", 1500],
   ["0,30", 0.30], ["90,5", 90.5], ["1.234.567,89", 1234567.89], [",5", 0.5],
   ["1.", 1], ["-500", -500], ["+5", 5], ["0", 0], ["1500 TL", 1500]
  ].forEach(function (t) {
    var c = sayiCozumle(t[0]);
    ol("okunuyor: " + JSON.stringify(t[0]) + " → " + t[1],
       c.gecerli && yakin(c.deger, t[1], 0.0001),
       c.gecerli ? String(c.deger) : "geçersiz");
  });
  /* Bunlar sayı DEĞİL. `parseFloat` hepsini sessizce kabul ederdi;
     en tehlikelisi `nan`: NaN ile yapılan her karşılaştırma false döner,
     yani konulan sınır hiç uygulanmaz. */
  ["1,2,3", "1.500.5", "abc", "12abc", "nan", "NaN", "1e3", "1_000", "Infinity", "inf"
  ].forEach(function (y) {
    var c = sayiCozumle(y);
    ol("reddediliyor: " + JSON.stringify(y), !c.gecerli, c.gecerli ? String(c.deger) : "");
  });
  ["", "   "].forEach(function (y) {
    ol("boş sayılıyor (geçersiz DEĞİL): " + JSON.stringify(y), sayiCozumle(y).bos);
  });
  ol("`0` geçerli bir sayı (null değil)",
     sayiCozumle("0").gecerli && sayiCozumle("0").deger === 0);

  /* ══ B · Oran alanı ════════════════════════════════════════════════
     Faiz/oran alanında nokta HER ZAMAN ondalıktır: "3.29" faizi 3,29'dur,
     3290 değil. Göz Molası'nda "nokta hep binliktir" kuralı yüzünden
     "1,500.50" 1,5005 okunmuştu — 1000 kat, sessiz. */
  bas("B · Oran alanı (data-tur=\"oran\")");
  [["0,30", 0.30], ["1.500", 1.5], ["1,500", 1.5], ["3.29", 3.29]].forEach(function (t) {
    var c = sayiCozumle(t[0], "oran");
    ol("oran " + JSON.stringify(t[0]) + " → " + t[1],
       c.gecerli && yakin(c.deger, t[1], 0.0001), c.gecerli ? String(c.deger) : "geçersiz");
  });
  ol("oran alanında binlik gruplama yok: \"1.234.567\"",
     !sayiCozumle("1.234.567", "oran").gecerli);

  /* ══ C · Bozuk satır sessizce düşmesin (27.08.2026) ════════════════
     `d.kredi > 0` süzgeci, kredi NaN olduğunda HER ZAMAN false döner.
     Kullanıcı 3 ders girip 2 dersin ortalamasını görüyordu: 75 yerine 85,
     hiçbir uyarı olmadan. */
  bas("C · Not ortalaması — bozuk ders sessizce düşmesin");
  var no = notOrtalamasi([
    { ad: "Türkçe", not: 70, kredi: 4 },
    { ad: "Matematik", not: 100, kredi: NaN },
    { ad: "Fen", not: 80, kredi: 2 }
  ]);
  ol("bozuk ders hesaba KATILMIYOR", no.dersSayisi === 2, "dersSayisi=" + no.dersSayisi);
  ol("bozuk ders SAYILIYOR", no.atlananSayisi === 1, "atlanan=" + no.atlananSayisi);
  ol("atlanan dersin ADI bildiriliyor",
     JSON.stringify(no.atlananlar || []).indexOf("Matematik") >= 0,
     JSON.stringify(no.atlananlar));
  ol("ortalama yalnız geçerli derslerden",
     yakin(no.ortalama, (70 * 4 + 80 * 2) / 6), String(no.ortalama));
  ol("sağlam listede atlanan yok",
     notOrtalamasi([{ ad: "A", not: 70, kredi: 4 }, { ad: "B", not: 80, kredi: 2 }]).atlananSayisi === 0);

  /* ══ D · Para değişmezleri — bağımsız aritmetik ════════════════════
     Ekrandaki sayı kendi parçalarıyla tutmalı. "Aynı değer için iki
     farklı sayı" sınıfı bu projede kıdem tazminatında yaşandı. */
  bas("D · Para değişmezleri");
  var p = netMaasPlani(75000, 1), a1 = p.aylar[0];
  ol("net maaş: brüt − kesintiler = net",
     yakin(a1.brut - (a1.sgkIsci + a1.issizlik + a1.gelirVergisi + a1.damga), a1.net),
     "fark=" + (a1.brut - (a1.sgkIsci + a1.issizlik + a1.gelirVergisi + a1.damga) - a1.net).toFixed(4));
  ol("net maaş: yıllık net = 12 ayın toplamı",
     yakin(p.yillikNet, p.aylar.reduce(function (s, x) { return s + x.net; }, 0)));
  ol("net maaş 12 ay üretiyor", p.aylar.length === 12, "ay=" + p.aylar.length);

  var k = krediHesapla(100000, 3.5, 12, true);
  ol("kredi: taksit × vade = toplam ödeme", yakin(k.taksit * 12, k.toplamOdeme, 0.05));
  ol("kredi: toplam ödeme − anapara = toplam faiz",
     yakin(k.toplamOdeme - 100000, k.toplamFaiz, 0.05));
  ol("kredi: ödeme planı vade kadar satır", !!(k.plan && k.plan.length === 12));

  var m = mevduatHesapla(100000, 45, 32, 15, false, 1);
  ol("mevduat: brüt faiz − stopaj = net faiz", yakin(m.brutFaiz - m.stopaj, m.netFaiz));
  ol("mevduat: anapara + net faiz = vade sonu", yakin(100000 + m.netFaiz, m.vadeSonu));

  var kt = kidemTazminati(50000, "2020-01-01", "2026-01-01");
  ol("kıdem: brüt − damga = net", yakin(kt.brut - kt.damga, kt.net));
  ol("kıdem: ters tarihte sayı ÜRETİLMİYOR",
     kidemTazminati(50000, "2026-01-01", "2020-01-01") === null);

  /* ══ E · Bozuk girdide uydurma sayı yok ════════════════════════════
     Ölçüldü: bu işlevler `null` DÖNMÜYOR, nesneyi döndürüp içindeki
     sayıları `null` yapıyorlar. Aranan şey "null döndü mü" değil,
     "sonlu bir sayı UYDURULDU mu". İlk yazdığımda yanlış iddia
     etmiştim; sınama kendi hatamı yakaladı. */
  bas("E · Bozuk girdi — sonlu sayı uydurulmuyor");
  function uydurmaYok(v) { return v === null || v === undefined || !Number.isFinite(v); }
  ol("netMaasPlani(NaN) net üretmiyor", uydurmaYok(netMaasPlani(NaN, 1).aylar[0].net),
     String(netMaasPlani(NaN, 1).aylar[0].net));
  ol("netMaasPlani(\"abc\") net üretmiyor", uydurmaYok(netMaasPlani("abc", 1).aylar[0].net));
  ol("krediHesapla faiz NaN ise taksit üretmiyor",
     uydurmaYok(krediHesapla(100000, NaN, 12, true).taksit));
  ol("kidemTazminati(NaN) net üretmiyor",
     uydurmaYok(kidemTazminati(NaN, "2020-01-01", "2026-01-01").net));

  /* ══ E2 · Saat/süre okuma (SAYI-SINAMA.md · B bölümü) ══════════════
     `parseInt(p[0], 10) || 0` hatayı gizliyordu: "abc:def" → 0 dakika,
     "10 pm" → 0 dakika, "12:75" → 795 dakika, "25:00" → 1500 dakika.
     Ayrıca `sureTopla` okunamayan satırı SESSİZCE düşürüyordu — aynı
     dosyadaki `notOrtalamasi` hatasının ikizi. */
  bas("E2 · Saat ve süre okuma");
  [["21:00", 21 * 60], ["9:05", 9 * 60 + 5], ["00:00", 0], ["23:59", 23 * 60 + 59],
   ["7,5", 450], ["30:00", 30 * 60]
  ].forEach(function (t) {
    ol("süre okunuyor: " + JSON.stringify(t[0]) + " → " + t[1] + " dk",
       dakikayaCevir(t[0]) === t[1], String(dakikayaCevir(t[0])));
  });
  ["abc:def", "10 pm", "12:75", "1:2:3", "abc"].forEach(function (y) {
    ol("reddediliyor: " + JSON.stringify(y), dakikayaCevir(y) === null,
       String(dakikayaCevir(y)));
  });
  ol("günün saati olarak \"25:00\" geçersiz", dakikayaCevir("25:00", true) === null);
  ol("süre olarak \"25:00\" geçerli (25 saat çalışılmış olabilir)",
     dakikayaCevir("25:00") === 25 * 60);
  ol("saatFarki bozuk saatte sayı üretmiyor", saatFarki("25:00", "30:00", 0) === null);
  ol("saatFarki sağlam saatte çalışıyor",
     (saatFarki("09:00", "17:30", 30) || {}).toplamDakika === 8 * 60);

  var st = sureTopla(["2:30", "abc", "1:15", ""]);
  ol("süre toplamı yalnız geçerli satırlardan", st.toplamDakika === 225,
     String(st.toplamDakika));
  ol("okunamayan satır SAYILIYOR", st.atlananSayisi === 1, "atlanan=" + st.atlananSayisi);
  ol("okunamayan satırın kendisi bildiriliyor",
     (st.atlananlar || []).indexOf("abc") >= 0, JSON.stringify(st.atlananlar));
  ol("boş satır atlanan sayılmıyor", sureTopla(["2:30", ""]).atlananSayisi === 0);

  /* ══ F · Sayı olmayan girdi EKRANDA görünüyor mu (27.08.2026) ══════
     Ölçüldü: kredi sayfasında faiz alanına "abc" yazılınca ekranda
     "Toplam faiz 0,00 ₺" ve %0'lık bir kredi çıkıyordu, uyarı yoktu.
     0 meşru bir faizdir (0 faizli kampanya kredisi vardır), o yüzden
     "0 geldi" ile "anlaşılmadı" ayırt edilemiyordu. `sayiGecersizMi`
     tam bunun için yazılmıştı ama 47 sayfanın hiçbiri çağırmıyordu. */
  bas("F · Sayı olmayan girdi görünür oluyor mu");
  ol("sayiGecersizMi: \"abc\" geçersiz", sayiGecersizMi("abc"));
  ol("sayiGecersizMi: boş kutu geçersiz DEĞİL", !sayiGecersizMi(""));
  ol("sayiGecersizMi: \"0\" geçersiz DEĞİL", !sayiGecersizMi("0"));
  ol("ortak denetim işlevi var", typeof girdileriDenetle === "function");
  ol("dinle() denetimi çağırıyor",
     typeof dinle === "function" && /girdileriDenetle/.test(dinle.toString()));

  var kap = document.createElement("div");
  kap.style.display = "none";
  kap.innerHTML =
    '<input id="_sBozuk" type="text" inputmode="decimal" value="abc">' +
    '<input id="_sSaglam" type="text" inputmode="decimal" value="1.500,50">' +
    '<input id="_sTarih" type="date" value="2026-01-01">' +
    '<input id="_sMetin" type="text" value="Matematik">';
  document.body.appendChild(kap);
  girdileriDenetle(["_sBozuk", "_sSaglam", "_sTarih", "_sMetin"]);
  ol("bozuk alan işaretleniyor",
     document.getElementById("_sBozuk").classList.contains("girdi-bozuk"));
  ol("bozuk alanın yanına uyarı yazılıyor", !!kap.querySelector(".girdi-uyari"));
  ol("geçerli alan işaretlenMİyor",
     !document.getElementById("_sSaglam").classList.contains("girdi-bozuk"));
  ol("tarih alanı yanlış alarm vermiyor",
     !document.getElementById("_sTarih").classList.contains("girdi-bozuk"));
  ol("düz metin alanı (ders adı) yanlış alarm vermiyor",
     !document.getElementById("_sMetin").classList.contains("girdi-bozuk"));
  document.getElementById("_sBozuk").value = "1500";
  girdileriDenetle(["_sBozuk"]);
  ol("düzeltilince uyarı kalkıyor",
     !document.getElementById("_sBozuk").classList.contains("girdi-bozuk") &&
     !kap.querySelector(".girdi-uyari"));
  kap.remove();

  /* ══ G · Gizli `type="number"` — SAYFAYI AÇARAK say ════════════════
     27.08.2026, Kur Pusulası: HTML'deki 21 alan düzeltilmişti ama
     `arayuz.js` içinde ŞABLONLA üretilen 9 kutu `type="number"` kalmıştı
     — biri fon fiyatı, yani para alanı. Projenin kendi sınaması bunu
     KAÇIRDI, çünkü dosyaya bakıyordu, açık sayfaya değil.
     Dosya taraması aday üretir, KANIT üretmez. Burada her sayfa gerçekten
     açılıyor, "ekle" düğmelerine basılıyor ve canlı DOM sayılıyor. */
  bas("G · Gizli type=\"number\" — sayfa açılarak sayılıyor");
  var sayfalar = ["net-maas-hesaplama.html", "kredi-hesaplama.html",
                  "mevduat-faizi-hesaplama.html", "kidem-tazminati-hesaplama.html",
                  "not-ortalamasi-hesaplama.html", "butce-hesaplama.html",
                  "birikim-hesaplama.html", "issizlik-maasi-hesaplama.html"];
  for (const ad of sayfalar) {
    var cerceve = document.createElement("iframe");
    cerceve.style.display = "none";
    cerceve.src = ad + "?t=" + T;
    document.body.appendChild(cerceve);
    await new Promise(function (c) { cerceve.onload = c; setTimeout(c, 3000); });
    try {
      var d = cerceve.contentDocument;
      // Dinamik satır ekleyen düğmelere bas ki şablon kutuları da doğsun.
      Array.from(d.querySelectorAll("button")).slice(0, 8).forEach(function (b) {
        if (/ekle|\+/i.test(b.textContent)) { try { b.click(); } catch (e) { } }
      });
      await new Promise(function (c) { setTimeout(c, 250); });
      var n = d.querySelectorAll('input[type=number]').length;
      var toplam = d.querySelectorAll("input").length;
      ol(ad + " → canlı type=\"number\" yok", n === 0,
         n ? (n + " adet gizli kutu") : (toplam + " girdi tarandı"));
    } catch (e) {
      ol(ad + " açılamadı", false, String(e));
    }
    cerceve.remove();
  }

  /* ══ H · `|| 0` kalıbı — hatayı gizleyen kurtarma ══════════════════
     `parseFloat(x) || 0`: "12,5" yazanın faizi sessizce %0 olur.
     `|| 0` sayıyı kurtarmaz, hatayı gizler. Bu proje `oku()` üzerinden
     `sayiCozumle`ye gidiyor; kalıp geri sızarsa burada yakalanır. */
  bas("H · Hatayı gizleyen `|| 0` kalıbı geri gelmiş mi");
  for (const dosya of ["hesap.js", "sayfa.js"]) {
    try {
      const c = await fetch(dosya + "?t=" + T);
      const metin = await c.text();
      const kod = metin.replace(/\/\*[\s\S]*?\*\//g, "").replace(/^[ \t]*\/\/.*$/gm, "");
      const bulgu = kod.match(/(parseFloat|Number|parseInt)\s*\([^)]*\)\s*\|\|\s*0/g) || [];
      ol(dosya + " → `|| 0` kurtarması yok", bulgu.length === 0,
         bulgu.length ? bulgu.join(" · ") : "");
      // `type="number"` yalnız HTML'de değil, ŞABLONDA da aranır:
      // Kur Pusulası'nda `arayuz.js` içinde 9 gizli kutu böyle kaçmıştı.
      const sablon = (kod.match(/type\s*=\s*\\?["']number\\?["']/g) || []).length;
      ol(dosya + " → şablonda type=\"number\" yok", sablon === 0,
         sablon ? (sablon + " adet") : "");
    } catch (e) { ol(dosya + " okunamadı", false, String(e)); }
  }

  /* ══ I · UÇ DEĞER: takvimin taşıyabileceği aralık ═════════════════
     Ölçüldü (28 Ağustos 2026, CANLIDA):
         tarihEkle("2026-08-26",   8000000) -> "+023929-11"  BOZUK DİZGİ
         tarihEkle("2026-08-26", 999999999) -> RangeError fırlatıyor
     Fırlatılan hata `hesapla()`yı yarıda kesiyordu ve ekranda ÖNCEKİ
     cevap kalıyordu: kullanıcı 999999999 yazarken ekran hâlâ "100 gün
     sonrası · 04.12.2026" diyordu. Çökme yok, uyarı yok — sadece yanlış.
     `split("-")` ile ayrıştıran her yer de "+023929-11"de bozulurdu. */
  bas("I · Uç değer — tarih aralığı taşması");
  ol("normal aralık çalışıyor", tarihEkle("2026-08-26", 100) === "2026-12-04",
     String(tarihEkle("2026-08-26", 100)));
  ol("uzak ama geçerli tarih üretiliyor",
     /^\d{4}-\d{2}-\d{2}$/.test(tarihEkle("2026-08-26", 100000) || ""),
     String(tarihEkle("2026-08-26", 100000)));
  [8000000, 999999999, -999999999, 1e15, Infinity, NaN].forEach(function (n) {
    var v;
    try { v = tarihEkle("2026-08-26", n); } catch (e) { v = "FIRLATTI: " + e.message; }
    ol("aralık dışı " + n + " → null (fırlatmıyor, bozuk dizgi vermiyor)",
       v === null, String(v));
  });
  ol("bozuk başlangıç tarihi → null", tarihEkle("abc", 10) === null,
     String(tarihEkle("abc", 10)));

  /* ══ J · İSTİSNA BAYAT SONUÇ BIRAKMAMALI ══════════════════════════
     `sonucBekliyor` bayat sonucu temizliyordu ama İSTİSNA YOLU ona hiç
     uğramıyordu. 42 aracın ortak geçidi `dinle()`; koruma orada.
     Burada kaynak okunarak aranır — davranış sınaması sayfa gerektirir,
     bu dosya çekirdeği ölçer. */
  bas("J · İstisna yolu bayat sonuç bırakıyor mu");
  try {
    const c2 = await fetch("sayfa.js?t=" + T);
    const m2 = await c2.text();
    const bas0 = m2.indexOf("function dinle("); const dinleGovde = bas0 < 0 ? "" : m2.slice(bas0, bas0 + 1600);
    ol("dinle() isle()'yi try/catch içinde çağırıyor",
       /try\s*\{[\s\S]{0,120}isle\(\)/.test(dinleGovde));
    ol("catch bloğu sonucBekliyor çağırıyor (eski cevap ekranda kalmasın)",
       /catch[\s\S]{0,400}sonucBekliyor/.test(dinleGovde));
    ol("hata sessizce yutulmuyor (console.error var)",
       /catch[\s\S]{0,300}console\.error/.test(dinleGovde));
  } catch (e) { ol("sayfa.js okunamadı", false, String(e)); }

  /* ══ K · Sayı listesi: okunamayan girdi sessizce SIFIR olmasın ════
     Ölçüldü (28 Ağustos 2026, CANLIDA):
         "12 abc 15"    -> [12, 0, 15]   ortalama 9    (doğrusu 13,5)
         "10 20 nan 30" -> [10,20,0,30]  ortalama 15   (doğrusu 20)
     Eski kod sonluluk süzgeciyle korunduğunu sanıyordu; ama `sayiOku`
     geçersizi 0 döndürür ve 0 SONLUDUR — süzgeç hiçbir şey elemiyordu.
     Sıfıra çevrilmiş bir hata, sonluluk denetiminden her zaman geçer.
     Üstelik bu araç, not ortalaması düzeltilirken "doğru desen" diye
     örnek gösterilmişti: örnek alınan uygulamanın kendisi bozuktu. */
  bas("K · Sayı listesi — okunamayan girdi");
  (function () {
    var d1 = sayiListesiOku("12 abc 15");
    ol("okunamayan girdi listeye 0 olarak GİRMİYOR", d1.length === 2,
       JSON.stringify(Array.prototype.slice.call(d1)));
    ol("ortalama kalan sayılara ait (13,5)",
       yakin(istatistik(d1).ortalama, 13.5), String(istatistik(d1).ortalama));
    ol("atlanan girdi BİLDİRİLİYOR (sessizce atılmıyor)",
       d1.atlananlar && d1.atlananlar.length === 1 && d1.atlananlar[0] === "abc",
       JSON.stringify(d1.atlananlar));

    var d2 = sayiListesiOku("10 20 nan 30");
    ol("\"nan\" sayı sayılmıyor", d2.length === 3 && yakin(istatistik(d2).ortalama, 20),
       String(istatistik(d2).ortalama));

    var d3 = sayiListesiOku("1.500,50 2.000");
    ol("Türkçe yazım listede de doğru okunuyor",
       d3.length === 2 && yakin(d3[0], 1500.5) && yakin(d3[1], 2000),
       JSON.stringify(Array.prototype.slice.call(d3)));

    var d4 = sayiListesiOku("abc def");
    ol("hepsi bozuksa sayı üretilmiyor", d4.length === 0 && d4.atlananlar.length === 2);

    var d5 = sayiListesiOku("12 15 18");
    ol("temiz girdide atlanan yok", d5.length === 3 && d5.atlananlar.length === 0);

    var d6 = sayiListesiOku("");
    ol("boş girdi çökmüyor", d6.length === 0);
  })();

  /* ══ L · Birim çevirme — DIŞ REFERANSLA ═══════════════════════════
     ÖNCE KÖR BİR TARAMA YAZDIM: 207 çifti gidiş-dönüş (a→b→a) ile
     sınadım, "hepsi temiz" dedi. Sonra `cm` katsayısını 0,01'den 0,1'e
     çektim — ON KAT yanlış — ve tarama YİNE "temiz" dedi.
     Sebep: gidiş-dönüşte hata kendini götürür; a→a her zaman 1'dir.
     Bir ölçüm, hem doğru hem yanlış durumda aynı cevabı veriyorsa
     hiçbir şey ölçmemiştir.
     Katsayı doğruluğu ancak BAĞIMSIZ bir referansla ölçülür. Aşağıdaki
     değerler uluslararası tanımlardan (SI / NIST) alınmıştır. */
  bas("L · Birim çevirme — dış referans");
  [["uzunluk","m","cm",1,100], ["uzunluk","km","m",1,1000],
   ["uzunluk","inc","cm",1,2.54], ["uzunluk","ft","cm",1,30.48],
   ["uzunluk","yd","m",1,0.9144], ["uzunluk","mil","m",1,1609.344],
   ["uzunluk","denizmili","m",1,1852], ["uzunluk","mm","m",1000,1],
   ["agirlik","kg","g",1,1000], ["agirlik","lb","kg",1,0.45359237],
   ["agirlik","oz","g",1,28.349523], ["agirlik","ton","kg",1,1000],
   ["alan","hektar","m2",1,10000], ["alan","donum","m2",1,1000],
   ["alan","ar","m2",1,100], ["alan","km2","m2",1,1000000],
   ["alan","ft2","m2",1,0.09290304],
   ["hacim","l","ml",1,1000], ["hacim","m3","l",1,1000],
   ["hacim","galon","l",1,3.785411784],
   ["hiz","kmh","ms",3.6,1], ["hiz","mph","kmh",1,1.609344],
   ["hiz","knot","kmh",1,1.852],
   ["sicaklik","C","F",0,32], ["sicaklik","C","F",100,212],
   ["sicaklik","C","K",0,273.15], ["sicaklik","F","C",32,0],
   ["sicaklik","K","C",373.15,100]
  ].forEach(function (t) {
    var v = birimCevir(t[0], t[1], t[2], t[3]);
    var tol = Math.max(0.000001, Math.abs(t[4]) * 0.000001);
    ol(t[3] + " " + t[1] + " → " + t[2] + " = " + t[4],
       isFinite(v) && Math.abs(v - t[4]) <= tol, String(v));
  });
  /* Bilinmeyen anahtar sessizce 0 dönüyor; arayüz açılır liste
     kullandığı için bugün oluşamaz, ama liste ile tablo AYRIŞIRSA
     oluşur. Ayrışmayı burada sabitliyoruz. */
  ol("bilinmeyen grup 0 dönüyor (arayüz listeyle sınırlı)",
     birimCevir("zzz", "m", "cm", 1) === 0);

  /* ══ M · SAĞLIK ARAÇLARI: uygulama kullanıcı adına hüküm vermez ═══
     Ölçüldü (28 Ağustos 2026): 59.840 profil tarandı. "Hızlı kilo
     verme" hedefi 38.282'sinde (%64) bazal metabolizmanın ALTINDA
     kalıyordu; 23 profilde sıfır ya da NEGATİF çıkıyordu (en düşük
     −106 kcal/gün — 80 yaş / 145 cm / 40 kg / hareketsiz).
     Sayı doğru hesaplanıyordu; sorun onu bir HEDEF olarak listelemekti.
     Eski sürümde uyarı vardı ama (a) sayı yine de listeleniyordu,
     (b) uyarı yalnız HIZLI seçeneği kapsıyordu — örnek profilde YAVAŞ
     seçenek de bazalın altındaydı ve hiç uyarılmıyordu.
     İKİ DALI DA ÖLÇ: uyarının çıkmadığı profili görmeden "koşul
     çalışıyor" denmez. */
  bas("M · Sağlık araçları — hüküm sınırı");
  (function () {
    var riskli = kaloriIhtiyaci(45, 150, 65, "kadin", 1.2);
    ol("riskli profilde hızlı hedef bazalın ALTINDA (çekirdek böyle hesaplıyor)",
       riskli.hizliVerme < riskli.bazal,
       Math.round(riskli.hizliVerme) + " < " + Math.round(riskli.bazal));
    ol("riskli profilde YAVAŞ hedef de bazalın altında (eski uyarı bunu kaçırıyordu)",
       riskli.kiloVerme < riskli.bazal,
       Math.round(riskli.kiloVerme) + " < " + Math.round(riskli.bazal));
    var guvenli = kaloriIhtiyaci(85, 180, 30, "erkek", 1.55);
    ol("güvenli profilde iki hedef de bazalın ÜSTÜNDE (ikinci dal)",
       guvenli.kiloVerme > guvenli.bazal && guvenli.hizliVerme > guvenli.bazal,
       Math.round(guvenli.hizliVerme) + " > " + Math.round(guvenli.bazal));
    // Negatif üretilebiliyor mu? (çekirdek sınırlamıyor; sayfa yazmıyor)
    var uc = kaloriIhtiyaci(40, 145, 80, "kadin", 1.2);
    ol("uç profilde hedef sıfırın altına inebiliyor — sayfa sayı yazmamalı",
       uc.hizliVerme < 0, String(Math.round(uc.hizliVerme)));
  })();

  bas("M2 · Sayfa korumaları yerinde mi (kaynak okunarak)");
  for (const s of [["kalori-ihtiyaci-hesaplama.html", "hedefSatiri", "önerilmiyor"],
                   ["vucut-kitle-indeksi-hesaplama.html", "boyMakul", "gerçekçi görünmüyor"]]) {
    try {
      const c3 = await fetch(s[0] + "?t=" + T);
      const m3 = await c3.text();
      ol(s[0] + " → koruma var (" + s[1] + ")", m3.indexOf(s[1]) >= 0);
      ol(s[0] + " → kullanıcıya sebep yazıyor", m3.indexOf(s[2]) >= 0);
    } catch (e) { ol(s[0] + " okunamadı", false, String(e)); }
  }

  /* ══ N · MOBİL — telefonda görünen, masaüstünde görünmeyen ═══════
     Bu sınıf 163 maddenin çoğunun dışında kalıyordu: masaüstü klavyesinde
     virgül de iki nokta da her zaman vardır, o yüzden hata hiç çıkmaz.

     Ölçüldü (28 Ağustos 2026): `saat-sure` sayfasının altı alanı
     `inputmode="numeric"` idi ve sayfanın kendi ipucu "Süreleri 7:30
     biçiminde yazın" diyordu. Telefonun sayı tuş takımında ne `:` ne `,`
     vardır — uygulama, kullanıcıya YAZAMAYACAĞI bir biçim tarif ediyordu.
     `boya-fayans` karo ölçüleri de aynı durumdaydı (33,3 cm yazılamaz). */
  bas("N · Mobil — sayı klavyesi ve görüntü alanı");
  for (const s of ["saat-sure-hesaplama.html", "boya-fayans-hesaplama.html",
                   "kredi-hesaplama.html", "net-maas-hesaplama.html"]) {
    try {
      const c4 = await fetch(s + "?t=" + T);
      const m4 = await c4.text();
      // Ondalık ya da iki nokta bekleyen alan `numeric` olmamalı
      const kotu = [];
      const girdiler = m4.match(/<input[^>]*inputmode[^>]*>/g) || [];
      girdiler.forEach(function (g) {
        if (!/inputmode\s*=\s*["']numeric["']/.test(g)) return;
        const ph = (g.match(/placeholder\s*=\s*["']([^"']*)/) || ["", ""])[1];
        const vl = (g.match(/value\s*=\s*["']([^"']*)/) || ["", ""])[1];
        if (/[:,]/.test(ph + vl)) kotu.push(ph || vl);
      });
      ol(s + " → ondalık/saat alanı numeric değil", kotu.length === 0, kotu.join(" · "));
      ol(s + " → viewport interactive-widget taşıyor",
         /interactive-widget=resizes-content/.test(m4));
    } catch (e) { ol(s + " okunamadı", false, String(e)); }
  }
  /* iOS, yazı tipi 16 px'in altındaysa girdiye dokununca sayfayı
     kendiliğinden büyütür ve düzen kayar. */
  try {
    const c5 = await fetch("stil.css?t=" + T);
    const m5 = await c5.text();
    const j5 = m5.indexOf("input, select, textarea");
    const blok = j5 < 0 ? "" : m5.slice(j5, j5 + 220);
    const fs = (blok.match(/font-size:\s*(\d+)px/) || ["", "0"])[1];
    ol("girdi yazı tipi 16 px ve üstü (iOS yakınlaştırma sıçraması yok)",
       Number(fs) >= 16, fs + "px");
  } catch (e) { ol("stil.css okunamadı", false, String(e)); }

  /* ══ O · BOZUK GİRDİ SESSİZCE SIFIR OLMASIN — sayfa korumaları ═══
     42 aracın hepsinde "abc" davranışı ölçüldü (28 Ağustos 2026).
     Üç araç sahte sonuç veriyordu:

       sayi-yaziyla-yazma  → "abc" yazınca tam güvenle "SIFIR LİRA".
         Aracın kendi etiketi "çek ve senet için yazım" — kullanıcının
         kopyalayıp çeke geçireceği metin buydu. Boş kutu da aynısını
         veriyordu.
       alan-cevre-hacim    → "abc", "0" ve BOŞ kutu üçü de "0 m²".
         Sayfa açılır açılmaz, hiçbir şey yazılmadan "0 m²" bir SONUÇ
         gibi duruyordu.
       dogum-izni          → "99" ve "-5" sessizce yasal aralığa
         kırpılıyordu. Kırpma doğru; söylenmemesi yanlıştı. Alandaki
         min/max ise type="text" kutusunda tarayıcı tarafından
         UYGULANMAZ — var oldukları için koruma sanılabilirdi.

     GERÇEK SIFIR AYRI ŞEYDİR: "0" yazan biri "Sıfır lira" görmeli. */
  bas("O · Bozuk girdi sessizce sıfır olmasın");
  for (const t of [["sayi-yaziyla-yazma.html", "sayiGecersizMi", "okunamadı"],
                   ["alan-cevre-hacim-hesaplama.html", "bozukOlan", "sıfırdan büyük"],
                   ["dogum-izni-hesaplama.html", "kirpmaNotu", "kullanılmadı"]]) {
    try {
      const c6 = await fetch(t[0] + "?t=" + T);
      const m6 = await c6.text();
      ol(t[0] + " → koruma var (" + t[1] + ")", m6.indexOf(t[1]) >= 0);
      ol(t[0] + " → kullanıcıya sebep yazıyor", m6.indexOf(t[2]) >= 0);
    } catch (e) { ol(t[0] + " okunamadı", false, String(e)); }
  }
  /* Çekirdek tarafı: `sayiGecersizMi` üç durumu ayırabiliyor mu?
     Sayfaların hepsi bu ayrımı ondan alıyor. */
  ol("geçersiz ayırt ediliyor", sayiGecersizMi("abc") === true);
  ol("boş geçersiz DEĞİL (henüz yazmadı)", sayiGecersizMi("") === false);
  ol("gerçek sıfır geçersiz DEĞİL", sayiGecersizMi("0") === false);
  ol("kısmen sayı da geçersiz", sayiGecersizMi("12abc") === true);

  /* ══ P · ÖLÜ `min`/`max` — görünen ama çalışmayan koruma ══════════
     Türkçe sayı yazımı için `type="number"`den kaçtık ve kutuları
     `type="text"` yaptık. Üstlerindeki `min`/`max` ORADA KALDI —
     tarayıcı bunları `text` türünde UYGULAMAZ. Kodu okuyan "sınır var"
     sanıyordu. **Görünen bir koruma, olmayan bir korumadan tehlikelidir.**

     Ölçüldü (28 Ağustos 2026, CANLIDA), 5 alanda:
       elektrikli-arac  evOran (0-100) → "%10000" kabul → 51,48 ₺
                                          "-%50"   kabul → 227,70 ₺
       kiralamak-mi     yil (1-30)     → aralık dışı yıl TAVSİYEYİ
                                          değiştiriyordu (Satın ↔ Kirala)
       kira-geliri      ay (1-12)      → "-49" → 0,00 ₺, uyarı yok
     Çözüm: bildirim zaten HTML'de duruyordu; `girdileriDenetle` artık
     onu OKUYUP uyguluyor. Sınır TEK KAYNAKTAN gelir, ayrışamaz. */
  bas("P · Ölü min/max canlıya çevrildi");
  try {
    const c7 = await fetch("sayfa.js?t=" + T);
    const m7 = await c7.text();
    ol("girdileriDenetle min/max okuyor", /getAttribute\("min"\)/.test(m7));
    ol("aralık dışı için ayrı mesaj var", m7.indexOf("olmalı. Aşağıdaki sonuç") >= 0);
  } catch (e) { ol("sayfa.js okunamadı", false, String(e)); }
  /* Bildirimin kendisi duruyor mu — silinirse koruma da gider. */
  for (const t of [["elektrikli-arac-sarj-maliyeti.html", "evOran"],
                   ["kiralamak-mi-satin-almak-mi.html", "yil"],
                   ["kira-geliri-vergisi-hesaplama.html", "ay"],
                   ["dogum-izni-hesaplama.html", "calisma"],
                   ["araba-masrafi-hesaplama.html", "yil"]]) {
    try {
      const c8 = await fetch(t[0] + "?t=" + T);
      const m8 = await c8.text();
      const et = (m8.match(new RegExp('<input[^>]*id="' + t[1] + '"[^>]*>')) || [""])[0];
      ol(t[0] + " → " + t[1] + " min/max bildirimi duruyor",
         et.indexOf(" min=") >= 0 && et.indexOf(" max=") >= 0, et.slice(0, 60));
    } catch (e) { ol(t[0] + " okunamadı", false, String(e)); }
  }

  /* ══ R · KAYNAK VE TARİH (K-45) ══════════════════════════════════
     Mevduat stopajı TEK ORAN DEĞİLDİR; vadeye göre değişir. Kodda
     düz 0,15 duruyordu ve yorumda "vadeye göre değişir" yazıyordu —
     yani kural BİLİNİYOR ama UYGULANMIYORDU. En yaygın durum olan
     6 aya kadar vadede gerçek oran %17,5; net getiri olduğundan
     YÜKSEK gösteriliyordu.
     Kaynak: 09.07.2025 Cumhurbaşkanı Kararı; 11444 sayılı Karar ile
     31.12.2026'ya uzatıldı (R.G. 20.06.2026/33286). */
  bas("R · Kaynak ve tarih — mevduat stopaj kademesi");
  ol("183 güne kadar %17,5", mevduatStopajOrani(32) === 17.5, String(mevduatStopajOrani(32)));
  ol("183 gün sınırı dahil", mevduatStopajOrani(183) === 17.5);
  ol("184–366 gün %15", mevduatStopajOrani(300) === 15);
  ol("366 gün sınırı dahil", mevduatStopajOrani(366) === 15);
  ol("366 günden uzun %10", mevduatStopajOrani(400) === 10);
  ol("geçersiz vade null döner", mevduatStopajOrani(0) === null &&
     mevduatStopajOrani(NaN) === null);
  /* Sayfa bunu kullanıcıya söylüyor mu — sınıflandırma kod yorumunda
     kalırsa yapılmamış sayılır (madde 178). */
  try {
    const c9 = await fetch("mevduat-faizi-hesaplama.html?t=" + T);
    const m9 = await c9.text();
    ol("sayfa kademeyi kullanıcıya yazıyor", m9.indexOf("Stopaj oranını") >= 0);
    ol("dayanak tarihi sayfada", m9.indexOf("09.07.2025") >= 0);
  } catch (e) { ol("sayfa okunamadı", false, String(e)); }
  /* Diğer kaynak yazımları */
  for (const t of [["saat-sure-hesaplama.html", "md. 63"],
                   ["elektrik-tuketimi-hesaplama.html", "yaklaşıktır"],
                   ["kalori-ihtiyaci-hesaplama.html", "Am J Clin Nutr"]]) {
    try {
      const ca = await fetch(t[0] + "?t=" + T);
      ol(t[0] + " → kaynak yazılı (" + t[1] + ")", (await ca.text()).indexOf(t[1]) >= 0);
    } catch (e) { ol(t[0] + " okunamadı", false, String(e)); }
  }

  /* ══ Sonuç ════════════════════════════════════════════════════════ */
  document.getElementById("liste").innerHTML = sonuclar.map(function (s) {
    if (s.bolum) return "<h2>" + s.bolum + "</h2>";
    return '<div class="s ' + (s.gecti ? "ok" : "yok") + '">' + (s.gecti ? "✓ " : "✗ ") +
           s.ad + (s.ayrinti ? ' <code>' + s.ayrinti + "</code>" : "") + "</div>";
  }).join("");
  var adet = sonuclar.filter(function (s) { return !s.bolum; }).length;
  var o = document.getElementById("ozet");
  o.className = hata ? "kaldi" : "gecti";
  o.textContent = hata ? hata + " SINAMA KALDI (" + adet + " toplam)"
                       : "TAMAM — " + adet + " sınamanın hepsi geçti";
  window.__sinama = { toplam: adet, hata: hata, sonuclar: sonuclar };
});
</script>
