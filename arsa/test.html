<html lang="tr">

  body { font-family: Consolas, monospace; background:#111; color:#ddd;
         padding:16px; font-size:13px; }

<body>
<pre id="cikti">calisiyor...</pre>

<script>
/* SINAMA HER ZAMAN DISKTEKI KODU OLCMELI.
   Sabit ?v=2 damgasiyla yuklerken tarayici onbellekteki ESKI cekirdek.js'i
   verdi ve sinama, artik var olmayan bir sürümü "gecti" diye olctu.
   Yayinda yasadigimiz hatanin aynisi: duzeltirsin, test gecer, calisan kod
   baskadir. Bu yuzden sinama dosyalari betikleri ZAMAN DAMGASIYLA ceker. */
(function () {
  var damga = Date.now();
  ['cekirdek.js', 'mevzuat.js'].forEach(function (dosya) {
    document.write('<script src="' + dosya + '?t=' + damga + '"><\/script>');
  });
})();
</script>
<script>
/* Basit test kosucusu. Node olmadigi icin gercek ortamda (tarayici) kosuyoruz. */

/* =====================================================================
   YALITIM BEKCISI — sinama, kullanicinin GERCEK verisine dokunuyor mu?
   ---------------------------------------------------------------------
   Kardes projede yasandi: bir sinama "sadece bir ayar dosyasina yazdi" ve
   kullanicinin bilgisayarini kalici kilitledi. Ders: sinamanin NE YAPMAYA
   CALISTIGI onemli degil; urunun gercek verisine YAZABILIYORSA tehlikelidir.

   Bu uygulamada kullanicinin verisi localStorage'da: arsa defteri ve tema.
   Bir sinama defteri ezerse kullanici kaydettigi arsalari kaybeder ve bunu
   FARK ETMEZ. O yuzden yalitimin kendisini olcuyoruz: bastan parmak izi
   aliyoruz, sonda karsilastiriyoruz. Degistiyse sinama BASARISIZ sayilir.
   ===================================================================== */
function depo_parmak_izi() {
  try {
    var a = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      a.push(k + '=' + (localStorage.getItem(k) || '').length);
    }
    return a.sort().join('|');
  } catch (e) {
    return 'ERISILEMEDI';   /* gizli sekme vb. — yazma da olamaz */
  }
}
var DEPO_BASLANGIC = depo_parmak_izi();

var satirlar = [];
var gecti = 0, kaldi = 0;

function yaz(s) { satirlar.push(s === undefined ? '' : s); }
function baslik(s) { yaz(''); yaz('=== ' + s + ' ==='); }

function dogrula(aciklama, kosul) {
  if (kosul) { gecti++; yaz('  [GECTI] ' + aciklama); }
  else       { kaldi++; yaz('  [KALDI] ' + aciklama); }
}

function tl(x) {
  return Number(x).toLocaleString('tr-TR', { maximumFractionDigits: 0 }) + ' TL';
}

var C = window.Cekirdek;

yaz('ARSA REHBERI — CEKIRDEK TESTI   surum ' + C.SURUM);

/* ------------------------------------------------------------------
   TEST 1 — Klasik dolandiricilik senaryosu
   "Belediye sinirinda arsa" diye satilan, ama hicbir hizmet gelmeyen yer.
   K5 (Yargitay 18. HD) uyarinca bu ARAZIDIR.
   ------------------------------------------------------------------ */
baslik('TEST 1 — "Belediyede arsa" diye satilan yer');

var senaryo1 = {
  belediye_icinde: true,
  imar_plani_var: false,
  hizmetler: {}          /* hicbir hizmet yok */
};
var v1 = C.vasif_belirle(senaryo1);
yaz('  Satici diyor ki : "Belediye sinirinda, imarli arsa"');
yaz('  Gercek sonuc    : ' + v1.sonuc);
yaz('  Gerekce         : ' + v1.gerekce);
yaz('  Eksik hizmetler : ' + v1.eksik_hizmetler.join(', '));
dogrula('Hizmet gelmeyen yer ARAZI olarak isaretlendi', v1.kod === 'arazi');
dogrula('Dayanak mevzuat guveninde', v1.guven === C.GUVEN.MEVZUAT);

/* Tum hizmetler gelirse ve imar plani varsa ARSA olmali */
var v2 = C.vasif_belirle({
  belediye_icinde: true, imar_plani_var: true,
  hizmetler: { yol:1, su:1, elektrik:1, ulasim:1, cop:1, kanalizasyon:1, aydinlatma:1 }
});
dogrula('Tam hizmetli + imar planli yer ARSA', v2.kod === 'arsa');

/* Hizmet var ama plan yok -> ara durum */
var v3 = C.vasif_belirle({
  belediye_icinde: true, imar_plani_var: false,
  hizmetler: { yol:1, su:1, elektrik:1 }
});
dogrula('Hizmet var / plan yok -> arsa_plansiz', v3.kod === 'arsa_plansiz');

/* ------------------------------------------------------------------
   TEST 2 — Imar hesabi: "bu arsaya ne yapabilirim?"
   500 m2 arsa, TAKS 0,30 / KAKS 1,50
   ------------------------------------------------------------------ */
baslik('TEST 2 — Imar hesabi (500 m2, TAKS 0,30, KAKS 1,50)');

var im = C.imar_hesapla({ alan: 500, taks: 0.30, kaks: 1.50 });
yaz('  Taban alani        : ' + im.taban_alani + ' m2');
yaz('  Toplam insaat alani: ' + im.toplam_insaat_alani + ' m2');
yaz('  Tahmini kat adedi  : ' + im.tahmini_kat_adedi);
yaz('  Tahmini daire      : ' + im.tahmini_daire_sayisi + ' adet (' +
    im.brut_daire_alani + ' m2 brut varsayimi)');

dogrula('Taban alani = 500 x 0,30 = 150', im.taban_alani === 150);
dogrula('Toplam insaat = 500 x 1,50 = 750', im.toplam_insaat_alani === 750);
dogrula('Kat adedi = 1,50 / 0,30 = 5', im.tahmini_kat_adedi === 5);
dogrula('Daire sayisi = 750 / 120 = 6', im.tahmini_daire_sayisi === 6);

/* KAKS verilmeyip TAKS + kat verilirse turetebilmeli */
var im2 = C.imar_hesapla({ alan: 500, taks: 0.30, kat_adedi: 5 });
dogrula('KAKS yoksa TAKS x kat ile turetiliyor', im2.kaks === 1.5);
dogrula('Turetme kullaniciya uyari olarak bildiriliyor', im2.uyari.length > 0);

/* Alan yoksa hata vermeli, sessizce sacma sonuc uretmemeli */
dogrula('Alan girilmezse hata donuyor', !!C.imar_hesapla({ taks: 0.3 }).hata);

/* ------------------------------------------------------------------
   TEST 3 — Deger tahmini
   Emsal: yanindaki parsel m2 1.000 TL'ye satilmis. Tam donanimli arsa.
   Hedef: ayni bolgede ama yola cephesi yok + hisseli tapu.
   ------------------------------------------------------------------ */
baslik('TEST 3 — Deger tahmini (emsal duzeltme)');

var emsal = {
  birim_fiyat: 1000,
  nitelik: 'arsa', imar_fonksiyon: 'konut', kaks: 1.5,
  yola_cephe: 'imar_yolu', altyapi: 'tam', konum: 'orta',
  tapu_turu: 'mustakil', egim: 'duz', geometri: 'duzgun'
};

var hedef = {
  alan: 500,
  nitelik: 'arsa', imar_fonksiyon: 'konut', kaks: 1.5,
  yola_cephe: 'yok', altyapi: 'tam', konum: 'orta',
  tapu_turu: 'hisseli', egim: 'duz', geometri: 'duzgun'
};

var d = C.deger_tahmini(emsal, hedef);

yaz('  Emsal birim fiyat  : ' + tl(d.emsal_birim_fiyat) + '/m2');
yaz('  Net etki           : %' + d.net_etki_yuzde);
yaz('  Tahmini birim fiyat: ' + tl(d.birim_fiyat.alt) + '  ..  ' +
    tl(d.birim_fiyat.orta) + '  ..  ' + tl(d.birim_fiyat.ust) + '  /m2');
yaz('  500 m2 toplam      : ' + tl(d.toplam_deger.alt) + '  ..  ' +
    tl(d.toplam_deger.orta) + '  ..  ' + tl(d.toplam_deger.ust));
yaz('  Belirsizlik bandi  : +/- %' + d.bant_yuzde);
yaz('');
yaz('  Farki yaratan kalemler:');
d.duzeltmeler.forEach(function (x) {
  if (x.etki_yuzde === 0) return;
  yaz('    ' + (x.etki_yuzde > 0 ? '+' : '') + x.etki_yuzde + '%  ' + x.ad +
      '  (' + x.hedef_durum + ')  [' + x.guven_etiket + ']');
});

dogrula('Cephesiz + hisseli arsa emsalden UCUZ cikti', d.net_etki_yuzde < 0);
dogrula('Duzeltme kalemleri kullaniciya aciklaniyor', d.duzeltmeler.length >= 9);
dogrula('Bant taban belirsizlikten genis', d.bant_yuzde > C.TABAN_BELIRSIZLIK * 100);
dogrula('Emsal fiyat verilmezse hata donuyor',
        !!C.deger_tahmini({}, hedef).hata);

/* Ayni ozelliklerde emsal ve hedef -> duzeltme 1,00 olmali */
var ayni = C.deger_tahmini(emsal, JSON.parse(JSON.stringify(emsal)));
dogrula('Ozdes parselde duzeltme 1,00', Math.abs(ayni.toplam_duzeltme - 1) < 1e-9);

/* ------------------------------------------------------------------
   TEST 4 — Eksik bilgi bandi genisletmeli (kesinlik taklidi yapmamali)
   ------------------------------------------------------------------ */
baslik('TEST 4 — Eksik bilgi belirsizligi buyutuyor mu?');

var az_bilgi = C.deger_tahmini({ birim_fiyat: 1000, nitelik: 'arsa' },
                               { alan: 500, nitelik: 'arsa' });
yaz('  Tam bilgi bandi : +/- %' + d.bant_yuzde);
yaz('  Az bilgi bandi  : +/- %' + az_bilgi.bant_yuzde);
yaz('  Eksik alan sayisi: ' + az_bilgi.eksik_bilgi.length);
dogrula('Az bilgide bant daha genis', az_bilgi.bant_yuzde > d.bant_yuzde);
dogrula('Eksik alanlar kullaniciya listeleniyor', az_bilgi.eksik_bilgi.length > 0);

/* ------------------------------------------------------------------
   TEST 5 — Risk taramasi
   ------------------------------------------------------------------ */
baslik('TEST 5 — Risk taramasi (en kotu senaryo)');

var r = C.risk_tara({
  belediye_icinde: true, imar_plani_var: false, hizmetler: {},
  tapu_turu: 'hisseli', yola_cephe: 'yok',
  takyidat_var: true, altyapi: 'yok', egim: 'dik'
});

yaz('  Kritik: ' + r.kritik_sayisi + '   Uyari: ' + r.uyari_sayisi +
    '   Bilgi: ' + r.bilgi_sayisi);
yaz('');
r.bulgular.forEach(function (b) {
  yaz('  [' + b.seviye.toUpperCase() + '] ' + b.baslik);
  yaz('        -> ' + b.ne_yapmali);
});

dogrula('En kotu senaryoda en az 3 kritik bulgu var', r.kritik_sayisi >= 3);
dogrula('Her bulgu "ne yapmali" iceriyor',
        r.bulgular.every(function (b) { return !!b.ne_yapmali; }));

/* Temiz parselde kritik bulgu olmamali */
var temiz = C.risk_tara({
  belediye_icinde: true, imar_plani_var: true,
  hizmetler: { yol:1, su:1, elektrik:1, ulasim:1, cop:1, kanalizasyon:1, aydinlatma:1 },
  tapu_turu: 'mustakil', yola_cephe: 'imar_yolu', altyapi: 'tam', egim: 'duz'
});
dogrula('Temiz parselde kritik bulgu yok', temiz.kritik_sayisi === 0);

/* ------------------------------------------------------------------
   TEST 6 — Durustluk denetimi
   Kullaniciya gosterilen her katsayinin kaynagi ve guven etiketi olmali.
   ------------------------------------------------------------------ */
baslik('TEST 6 — Durustluk denetimi (kaynaksiz katsayi var mi?)');

var kaynaksiz = [], etiketsiz = [], baslangic = [];
C.FAKTOR_SIRASI.forEach(function (k) {
  var f = C.DUZELTME[k];
  if (!f.kaynak) kaynaksiz.push(k);
  if (!f.guven || !C.GUVEN_ETIKET[f.guven]) etiketsiz.push(k);
  if (f.guven === C.GUVEN.BASLANGIC) baslangic.push(f.ad);
});

yaz('  Toplam faktor          : ' + C.FAKTOR_SIRASI.length);
yaz('  Kaynaksiz katsayi      : ' + kaynaksiz.length);
yaz('  Guven etiketi olmayan  : ' + etiketsiz.length);
yaz('  Kalibre edilecek (tahmin): ' + baslangic.length + ' / ' + C.FAKTOR_SIRASI.length);
yaz('    -> ' + baslangic.join(', '));

dogrula('Her faktorun kaynagi yazili', kaynaksiz.length === 0);
dogrula('Her faktorun guven etiketi var', etiketsiz.length === 0);
/* Metin 27.08.2026'da Turkcelestirildi; bu sinama degisikligi YAKALADI
   (ASCII kalibi artik tutmuyordu). Iddia yeni metne gore guncellendi —
   sinamayi susturmak yerine dogrusunu yazmak. */
dogrula('Sonuc metni "DEĞERLEME RAPORU DEĞİLDİR" uyarisi iceriyor',
        d.guven_notu.indexOf('DEĞERLEME RAPORU DEĞİLDİR') !== -1);

/* ------------------------------------------------------------------
   TEST 7 — Yayimlanmis puanlama tablolari dogru mu kodlanmis?
   Kaynak K7 (Avanos) tablolarindan birebir kontrol.
   ------------------------------------------------------------------ */
baslik('TEST 7 — Yayimlanmis puanlama tablolari (K7)');

dogrula('Egim %5  -> 100 puan', C.puan_egim(5) === 100);
dogrula('Egim %15 ->  70 puan', C.puan_egim(15) === 70);
dogrula('Egim %25 ->  50 puan', C.puan_egim(25) === 50);
dogrula('Egim %35 ->  20 puan', C.puan_egim(35) === 20);
dogrula('Egim %60 ->   0 puan', C.puan_egim(60) === 0);

dogrula('Mesafe 20 m  -> 100 puan', C.puan_mesafe(20) === 100);
dogrula('Mesafe 30 m  ->  90 puan', C.puan_mesafe(30) === 90);
dogrula('Mesafe 350 m ->   5 puan', C.puan_mesafe(350) === 5);
dogrula('Mesafe 900 m ->   1 puan', C.puan_mesafe(900) === 1);

dogrula('Ana cadde 40 m  -> 100', C.puan_ana_cadde(40) === 100);
dogrula('Ana cadde 80 m  ->  90', C.puan_ana_cadde(80) === 90);
dogrula('Ana cadde 150 m ->  80 (her 100 m -10)', C.puan_ana_cadde(150) === 80);
dogrula('Ana cadde 250 m ->  70', C.puan_ana_cadde(250) === 70);

dogrula('Merkez 400 m  -> 80', C.puan_merkez(400) === 80);
dogrula('Merkez 4000 m -> 10', C.puan_merkez(4000) === 10);

dogrula('Baki guney 100 / kuzey 50',
        C.PUAN_BAKI.guney === 100 && C.PUAN_BAKI.kuzey === 50);
dogrula('Kose parsel 100 / ara parsel 0',
        C.PUAN_ADA_ICI.kose === 100 && C.PUAN_ADA_ICI.ara === 0);

/* K6 agirliklari toplami yayindaki gibi 99,90 olmali */
var agirlik_toplam = 0;
Object.keys(C.NOMINAL_AGIRLIK).forEach(function (k) {
  agirlik_toplam += C.NOMINAL_AGIRLIK[k].agirlik;
});
yaz('  K6 agirlik toplami: ' + agirlik_toplam.toFixed(2) + ' (yayinda 99,90)');
dogrula('Agirlik toplami yayindaki degerle ayni',
        Math.abs(agirlik_toplam - 99.90) < 0.001);
dogrula('En agir faktor "toplam insaat alani" (%16,70)',
        C.NOMINAL_AGIRLIK.yapilasma_hakki.agirlik === 16.70);

/* ------------------------------------------------------------------
   TEST 8 — Nominal puanlama ve iki yontemli birlesik analiz
   ------------------------------------------------------------------ */
baslik('TEST 8 — Nominal puan + iki yontemli analiz');

var tam_hizmet = { yol:1, su:1, elektrik:1, ulasim:1, cop:1, kanalizasyon:1, aydinlatma:1 };

var emsalN = {
  birim_fiyat: 1000,
  /* carpan motoru icin */
  nitelik:'arsa', imar_fonksiyon:'konut', kaks:1.5, yola_cephe:'imar_yolu',
  altyapi:'tam', konum:'orta', tapu_turu:'mustakil', egim:'duz', geometri:'duzgun',
  /* nominal motor icin */
  hizmetler: tam_hizmet, deprem_bolgesi:4, zemin:'saglam', egim_yuzde:5,
  ada_ici_konum:'kose', sekil:'dortgen', baki:'guney', manzara:true,
  ana_cadde_m:40, merkez_m:400, egitim_m:200, yesil_alan_m:150, saglik_m:300
};

var hedefN = {
  alan: 500, birim_fiyat: 1000,
  nitelik:'arsa', imar_fonksiyon:'konut', kaks:1.5, yola_cephe:'imar_yolu',
  altyapi:'kismi', konum:'kenar', tapu_turu:'mustakil', egim:'hafif', geometri:'duzgun',
  hizmetler: { yol:1, su:1, elektrik:1 }, deprem_bolgesi:3, zemin:'orta',
  egim_yuzde:18, ada_ici_konum:'ara', sekil:'cokgen', baki:'kuzey', manzara:false,
  ana_cadde_m:600, merkez_m:2200, egitim_m:800, yesil_alan_m:700, saglik_m:900
};

var pe = C.nominal_puan(emsalN);
var ph = C.nominal_puan(hedefN);
yaz('  Emsal nominal puani : ' + pe.puan + ' / 100   (kapsam %' + pe.kapsam_yuzde + ')');
yaz('  Hedef nominal puani : ' + ph.puan + ' / 100   (kapsam %' + ph.kapsam_yuzde + ')');

dogrula('Emsal puani hedeften yuksek (daha iyi parsel)', pe.puan > ph.puan);
dogrula('Puan 0-100 araliginda', ph.puan >= 0 && ph.puan <= 100);
dogrula('Tum faktorler dolduruldugunda kapsam %100', pe.kapsam_yuzde >= 99.9);

var an = C.deger_analizi(emsalN, hedefN);
yaz('');
yaz('  Carpan yontemi      : ' + tl(an.yontemler.carpan) + '/m2');
yaz('  Nominal yontemi     : ' + tl(an.yontemler.nominal) + '/m2');
yaz('  Iki yontem ayrismasi: %' + an.ayrisma_yuzde);
yaz('  BIRLESIK SONUC      : ' + tl(an.birim_fiyat.alt) + '  ..  ' +
    tl(an.birim_fiyat.orta) + '  ..  ' + tl(an.birim_fiyat.ust) + '  /m2');
yaz('  500 m2 toplam       : ' + tl(an.toplam_deger.alt) + '  ..  ' +
    tl(an.toplam_deger.orta) + '  ..  ' + tl(an.toplam_deger.ust));
yaz('  Bant                : +/- %' + an.bant_yuzde);

dogrula('Iki yontem de calisti', an.yontem_sayisi === 2);
dogrula('Birlesik bant, yontem ayrismasindan kucuk degil',
        an.bant_yuzde >= an.ayrisma_yuzde - 0.05);
dogrula('Toplam deger alan ile carpilmis',
        Math.abs(an.toplam_deger.orta - an.birim_fiyat.orta * 500) < 600);

/* Ozdes parselde nominal oran 1,00 olmali */
var ozdes = C.deger_nominal(emsalN, JSON.parse(JSON.stringify(emsalN)));
dogrula('Ozdes parselde nominal oran 1,00', Math.abs(ozdes.oran - 1) < 1e-9);

/* KOR NOKTA TESTI — K6 agirlik seti yola cephe / tapu turu / vasif icermez.
   Bunlar ayrica uygulanmazsa nominal yontem parselin en agir kusurlarini
   goremez ve iki yontem sacma sekilde ayrisir. */
dogrula('Kor nokta listesi 3 faktor', C.NOMINAL_KOR_NOKTA.length === 3);
dogrula('Yola cephe nominal agirlik setinde YOK',
        C.NOMINAL_AGIRLIK.yola_cephe === undefined);
dogrula('Tapu turu nominal agirlik setinde YOK',
        C.NOMINAL_AGIRLIK.tapu_turu === undefined);

var kotu = JSON.parse(JSON.stringify(emsalN));
kotu.alan = 500; kotu.yola_cephe = 'yok'; kotu.tapu_turu = 'hisseli';
var kotu_n = C.deger_nominal(emsalN, kotu);
yaz('');
yaz('  Sadece cephe+tapu bozuk parsel:');
yaz('    Nominal puan orani  : ' + kotu_n.puan_orani + '  (puanlar ayni, fark yok)');
yaz('    Kor nokta duzeltmesi: ' + kotu_n.kor_nokta_orani);
yaz('    Nihai oran          : ' + kotu_n.oran);
dogrula('Nominal puanlar esit (bu faktorleri gormuyor)',
        Math.abs(kotu_n.puan_orani - 1) < 1e-9);
dogrula('Kor nokta duzeltmesi devreye girdi', kotu_n.kor_nokta_orani < 0.5);
dogrula('Nihai oran cephe+tapu kusurunu yansitiyor', kotu_n.oran < 0.5);

var an_kotu = C.deger_analizi(emsalN, kotu);
yaz('    Iki yontem ayrismasi: %' + an_kotu.ayrisma_yuzde);
dogrula('Duzeltme sonrasi iki yontem makul yakinlikta (<%25)',
        an_kotu.ayrisma_yuzde < 25);

/* Eksik bilgi puani haksiz dusurmemeli, sadece kapsami daraltmali */
var eksikli = C.nominal_puan({ hizmetler: tam_hizmet, egim_yuzde: 5 });
yaz('');
yaz('  Sadece 2 faktor girilirse: puan ' + eksikli.puan +
    ', kapsam %' + eksikli.kapsam_yuzde + ', eksik ' + eksikli.eksik.length + ' faktor');
dogrula('Eksik faktorler puani sifirlamiyor', eksikli.puan > 90);
dogrula('Kapsam dusuk oldugu bildiriliyor', eksikli.kapsam_yuzde < 30);

/* ------------------------------------------------------------------
   TEST 9 — Literaturun BULAMADIGI seyler dogru etiketlenmis mi?
   Arastirma sonucu: hisseli tapu icin literaturde SAYI YOK.
   ------------------------------------------------------------------ */
baslik('TEST 9 — Dayanaksiz katsayilar dogru isaretli mi?');

dogrula('Hisseli tapu katsayisi "tahmin" olarak isaretli',
        C.DUZELTME.tapu_turu.guven === C.GUVEN.BASLANGIC);
dogrula('Arsa/arazi vasif katsayisi "tahmin" olarak isaretli',
        C.DUZELTME.nitelik.guven === C.GUVEN.BASLANGIC);
dogrula('Konum katsayisi olculmus kaynaga dayaniyor',
        C.DUZELTME.konum.guven === C.GUVEN.OLCULDU);
dogrula('K6/K7/K8/K9/K10 kaynaklari kunyede var',
        !!(C.KAYNAK.K6 && C.KAYNAK.K7 && C.KAYNAK.K8 && C.KAYNAK.K9 && C.KAYNAK.K10));

var nominal_olculdu = 0, nominal_baslangic = 0;
Object.keys(C.NOMINAL_PUANLAYICI).forEach(function (k) {
  if (C.NOMINAL_PUANLAYICI[k].guven === C.GUVEN.OLCULDU) nominal_olculdu++;
  else nominal_baslangic++;
});
yaz('  Nominal modulde olculmus puanlama: ' + nominal_olculdu +

baslik('TEST 10 — Insaat maliyeti (RG 3.02.2026 / 33157)');

var ks = M.konut_sinifi({ kat_adedi: 3 });
yaz('  3 katli apartman -> sinif ' + ks.sinif + ' (' + ks.gerekce + ')');
dogrula('3 kata kadar konut III-A sinifi', ks.sinif === '3A');
dogrula('III-A birim maliyeti 19.800 TL/m2', M.YAPI_BIRIM_MALIYET['3A'].tl === 19800);

var ks2 = M.konut_sinifi({ kat_adedi: 6, yapi_yuksekligi_m: 19 });

var ks3 = M.konut_sinifi({ mustakil: true, bagimsiz_bolum_brut_m2: 350 });
dogrula('350 m2 mustakil villa III-C sinifi', ks3.sinif === '3C');

/* Kullanici kat sayisini bilir, metre yuksekligi genelde bilmez.

dogrula('Kat da yukseklik de yoksa hata donuyor', !!M.konut_sinifi({}).hata);

/* Test 2'deki 750 m2 insaat alani uzerinden */

yaz('  750 m2 x 19.800 TL = ' + tl(mal.kdv_haric) + '  (KDV haric)');

dogrula('Kullanici %25 vergi ziyai cezasi konusunda uyariliyor',

baslik('TEST 12 — Emlak vergisi (1319 s.K. md. 8 ve 18)');

var ev1 = M.emlak_vergisi({ vergi_degeri: 1000000, tur: 'arsa', buyuksehir: false });

yaz('  Arsa (normal)      : binde ' + ev1.oran_binde + ' -> ' + tl(ev1.yillik_vergi));
yaz('  Arsa (buyuksehir)  : binde ' + ev2.oran_binde + ' -> ' + tl(ev2.yillik_vergi));
yaz('  Arazi (normal)     : binde ' + ev3.oran_binde + ' -> ' + tl(ev3.yillik_vergi));
yaz('  + Kultur varliklari katki payi (%10): ' + tl(ev1.kultur_varliklari_katki_payi));

dogrula('Arsa binde 3 = 3.000 TL', ev1.yillik_vergi === 3000);
dogrula('Buyuksehirde iki kat = 6.000 TL', ev2.yillik_vergi === 6000);

baslik('TEST 13 — Deger artis kazanci (GVK mukerrer md. 80/81, 2026)');

/* 2026 tarifesinin kirilim noktalari — tebligdeki kumulatif degerlerle birebir */
dogrula('190.000 TL matrah -> 28.500 TL vergi', M.gelir_vergisi(190000) === 28500);
dogrula('400.000 TL matrah -> 70.500 TL vergi', M.gelir_vergisi(400000) === 70500);
dogrula('1.000.000 TL matrah -> 232.500 TL vergi', M.gelir_vergisi(1000000) === 232500);
dogrula('5.300.000 TL matrah -> 1.737.500 TL vergi', M.gelir_vergisi(5300000) === 1737500);

var d5 = M.deger_artis_kazanci({
  alis_bedeli: 1000000, satis_bedeli: 3000000,

});

});

var dm = M.deger_artis_kazanci({ alis_bedeli: 0, satis_bedeli: 2000000, bedelsiz_iktisap: true });

var c4 = M.cekme_mesafeleri({ kat_adedi: 4 });
var c6 = M.cekme_mesafeleri({ kat_adedi: 6 });

yaz('  6 kat -> on ' + c6.on + ' m / yan ' + c6.yan + ' m / arka ' + c6.arka + ' m');

dogrula('On bahce her zaman 5,00 m', c4.on === 5 && c6.on === 5);
dogrula('4 katta yan/arka 3,00 m', c4.yan === 3 && c4.arka === 3);
dogrula('6 katta yan/arka 4,00 m (2 kat x 0,50)', c6.yan === 4);
dogrula('Park alanina komsu cephede artis yok', c6p.yan === 3);

var cy = M.cekme_mesafeleri({ kat_adedi: 20, yapi_yuksekligi_m: 62 });

var tsp = M.taks_siniri({ nizam: 'ayrik', planda_taks: 0.35 });

var eh = M.emsal_harici_kontrol({ emsale_esas_alan: 1000, emsal_harici_alan: 250 });
var eh2 = M.emsal_harici_kontrol({ emsale_esas_alan: 1000, emsal_harici_alan: 400 });
yaz('  1000 m2 emsal / 250 m2 harici -> tavan ' + eh.tavan + ' m2, uygun: ' + eh.uygun_mu);
yaz('  1000 m2 emsal / 400 m2 harici -> asim ' + eh2.asim + ' m2');
dogrula('Emsal harici tavani %30', eh.tavan === 300);
dogrula('250 m2 tavan icinde', eh.uygun_mu === true);
dogrula('400 m2 tavani 100 m2 asiyor', eh2.asim === 100);

baslik('TEST 15 — Butunlesik senaryo: 500 m2 arsa alip ev yapmak');

var senaryo = { alan: 500, taks: 0.30, kaks: 1.50 };
var imar = C.imar_hesapla(senaryo);
var sinif = M.konut_sinifi({ kat_adedi: Math.round(imar.tahmini_kat_adedi) });
var maliyet = M.insaat_maliyeti(imar.toplam_insaat_alani, sinif.sinif, { kdv_orani: 0.20 });
var arsa_bedeli = 500 * 3000;   /* varsayim: m2 3.000 TL */
var harc = M.tapu_harci({ beyan_bedeli: arsa_bedeli });
var vergi = M.emlak_vergisi({ vergi_degeri: arsa_bedeli, tur: 'arsa', buyuksehir: true });
var cekme = M.cekme_mesafeleri({ kat_adedi: Math.round(imar.tahmini_kat_adedi) });

yaz('  Arsa       : 500 m2, m2 3.000 TL  ->  ' + tl(arsa_bedeli));
yaz('  Tapu harci : alici payi           ->  ' + tl(harc.alici_harci));
yaz('  Doner serm.: (yoresel katsayiya bagli, kullanicidan alinacak)');
yaz('  Yapilabilir: ' + imar.toplam_insaat_alani + ' m2, ' +
    imar.tahmini_kat_adedi + ' kat, ' + imar.tahmini_daire_sayisi + ' daire');
yaz('  Cekme mes. : on ' + cekme.on + ' / yan ' + cekme.yan + ' / arka ' + cekme.arka + ' m');
yaz('  Insaat     : ' + sinif.sinif + ' sinifi, ' + tl(maliyet.kdv_dahil) + ' (KDV dahil)');
yaz('  Emlak verg.: yillik ' + tl(vergi.toplam) + ' (buyuksehir, katki payi dahil)');
yaz('  ----------------------------------------');
yaz('  TOPLAM YATIRIM: ' + tl(arsa_bedeli + harc.alici_harci + maliyet.kdv_dahil));

dogrula('Butunlesik senaryoda hicbir modul hata vermedi',
        !imar.hata && !sinif.hata && !maliyet.hata && !harc.hata && !vergi.hata);
dogrula('Toplam yatirim arsa bedelinden buyuk',
        (arsa_bedeli + harc.alici_harci + maliyet.kdv_dahil) > arsa_bedeli);

baslik('TEST 16 — Mevzuat durustluk denetimi');

var sinif_sayisi = Object.keys(M.YAPI_BIRIM_MALIYET).length;
yaz('  Yapi sinifi sayisi: ' + sinif_sayisi + ' (2026 tebliginde 18 grup)');
dogrula('18 yapi sinifi tanimli', sinif_sayisi === 18);
dogrula('2026 tebliginde olmayan III-D sinifi eklenmemis',
        M.YAPI_BIRIM_MALIYET['3D'] === undefined);
dogrula('Her mevzuat hesabi kaynak donduruyor',
        !!(mal.kaynak && th.kaynak && ev1.kaynak && d2.kaynak && c4.kaynak));
dogrula('Dogrulanamayan doner sermaye katsayisi isaretli',
        M.DONER_SERMAYE.katsayi_dogrulanma === false);
dogrula('Yil sabiti 2026', M.YIL === 2026);

   TEST 17 — TURKCE SAYI COZUMLEYICI
   Supurme sinamasinin buldugu 1000 kat sessiz hata buraya kilitlendi.

baslik('TEST 17 — Turkce sayi cozumleyici (sessiz hata kilidi)');

[['1.500,50', 1500.5, 'binlik nokta + ondalik virgul'],
 ['1500,50',  1500.5, 'sadece ondalik virgul'],
 ['1500.50',  1500.5, 'sadece ondalik nokta'],

 ['2.800',    2800,   'binlik nokta'],
 ['1.234.567',1234567,'iki binlik nokta'],
 ['12,5',     12.5,   'kucuk ondalik'],
 ['0,30',     0.30,   'sifirla baslayan ondalik'],
 ['  450 ',   450,    'bosluklu'],
 ['1.500,50 TL', 1500.5, 'TL ekli'],

 ['620 m²',   620,    'metrekare ekli'],
 [1500.5,     1500.5, 'zaten sayi']
].forEach(function (x) {

/* ------------------------------------------------------------------ */


/* ------------------------------------------------------------------
   TEST 18 — SESSIZ KIRPMA (ortak sayi sinama kumesi, 01 oturumu)
   parseFloat onden okur, gerisini SESSIZCE atar. "1_000" -> 1 yine
   1000 kat hata; ayni sinif ikinci kez cikti.
   ------------------------------------------------------------------ */
baslik('TEST 18 — Sessiz kirpma ve gecersiz girdi');

['nan','NaN','inf','Infinity','-Infinity','1e3','1E3','1_000','12abc',
 'abc12','0x1F','--5','1.2.3','1,2,3','','   ','TL','?'].forEach(function (g) {
  dogrula('Gecersiz "' + g + '" -> null (sessiz sayi uretmiyor)',
          C.sayi_oku(g) === null);
});

/* En kritigi: 1000 kat hatanin ikinci bicimi */
dogrula('KILIT: "1_000" ASLA 1 okunmuyor', C.sayi_oku('1_000') !== 1);
dogrula('KILIT: "12abc" ASLA 12 okunmuyor', C.sayi_oku('12abc') !== 12);

/* Gecerli yazimlar bozulmamis olmali */
[['1500',1500],['1500.50',1500.5],['1500,50',1500.5],['1.500',1500],
 ['1.500,50',1500.5],['1,500.50',1500.5],['1 500',1500],['1500 TL',1500],
 [' 1500 ',1500],['12,5',12.5],['0,30',0.30],['+500',500],['-500',-500]
].forEach(function (x) {
  var s = C.sayi_oku(x[0]);
  dogrula('Gecerli "' + x[0] + '" hala ' + x[1], s !== null && Math.abs(s - x[1]) < 1e-9);
});

/* KARAR (kanon degil, bu projenin secimi):
   "12.345" -> 12345. Turkce yazimda nokta binlik ayracidir ve bu uygulamada
   alan (m2) ile fiyat (TL) girilir; 12,345 m2 gibi bir olcu gercekci degil. */
dogrula('KARAR: "12.345" binlik sayilir -> 12345', C.sayi_oku('12.345') === 12345);


/* ------------------------------------------------------------------
   TEST 19 — ALAN TURUNE GORE SAYI OKUMA (1000 KAT HATA KILIDI)
   En ciddi hata buydu ve 256 sinama gecerken sakliydi: uc ondalik
   haneli yazim hic denenmemisti.
       TAKS "0,300" -> 300      (dogrusu 0,3)
       KAKS "1,500" -> 1500     (dogrusu 1,5)
   Bu uygulamada TAKS/KAKS tam bu bicimde yazilir; insaat alanini
   dogrudan 1000 kat sisiriyordu.
   Nokta surumu (0.300 -> 300) BASTAN BERI vardi, sonradan gelmedi.
   ------------------------------------------------------------------ */
baslik('TEST 19 — Alan turune gore sayi okuma');

/* Basta yalniz "0" varsa binlik gruplama OLAMAZ — her alan turunde */
[['0,300',0.3],['0.300',0.3],['0,250',0.25],['0.250',0.25],['0,125',0.125]
].forEach(function (x) {
  dogrula('KILIT: "' + x[0] + '" -> ' + x[1] + ' (300 DEGIL)',
          Math.abs(C.sayi_oku(x[0]) - x[1]) < 1e-9);
});

/* ORAN alani: ayrac her zaman ondalik */
[['0,300',0.3],['1,500',1.5],['1.500',1.5],['0,30',0.3],['2,5',2.5],['1,25',1.25]
].forEach(function (x) {
  dogrula('Oran "' + x[0] + '" -> ' + x[1],
          Math.abs(C.sayi_oku(x[0], 'oran') - x[1]) < 1e-9);
});

/* PARA/ALAN alani: binlik yorumu korunuyor */
[['1.500',1500],['1,500',1500],['12.000',12000],['1.500.500',1500500],
 ['1,500,500',1500500],['1.500,50',1500.5],['1,500.50',1500.5]
].forEach(function (x) {
  dogrula('Para/alan "' + x[0] + '" -> ' + x[1],
          Math.abs(C.sayi_oku(x[0]) - x[1]) < 1e-9);
});

/* Ayni dizi, alana gore FARKLI okunmali — isin ozu bu */
dogrula('AYNI DIZI FARKLI ANLAM: "1,500" para=1500 / oran=1,5',
        C.sayi_oku('1,500') === 1500 && C.sayi_oku('1,500', 'oran') === 1.5);

/* Bozuk gruplama her turde reddedilir */
['1,2,3','1.2.3','1.500.5','1,500,5','12,34,56'].forEach(function (g) {
  dogrula('Bozuk gruplama "' + g + '" -> null',
          C.sayi_oku(g) === null && C.sayi_oku(g, 'oran') === null);
});
