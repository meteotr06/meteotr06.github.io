<script>
/* SINAMA HER ZAMAN DISKTEKI KODU OLCMELI.
   Sabit ?v=2 damgasiyla yuklerken tarayici onbellekteki ESKI cekirdek.js'i

<script>
/* =====================================================================
   SÜPÜRME SINAMASI — "sessiz yanlış sayı" avı
   ---------------------------------------------------------------------
   `test.html` tek tek davranışları ölçer. Bu dosya farklı bir soru sorar:
   uygulama ÇÖKMEDEN yanlış sayı veriyor olabilir mi?

   Çökme kendini belli eder. Yanlış sayı etmez — ve bu projede yanlış sayı
   birinin parası demek. En tehlikeli hata sınıfı budur.
   ===================================================================== */


/* =====================================================================
   YALITIM BEKCISI — sinama, kullanicinin GERCEK verisine dokunuyor mu?
   ---------------------------------------------------------------------
   Kardes projede yasandi: bir sinama "sadece bir ayar dosyasina yazdi" ve
   kullanicinin bilgisayarini kalici kilitledi. Ders: sinamanin NE YAPMAYA
   CALISTIGI onemli degil; urunun gercek verisine YAZABILIYORSA tehlikelidir.

   Bu uygulamada kullanicinin verisi localStorage'da: arsa defteri ve tema.
   Bir sinama defteri ezerse kullanici kaydettigi arsalari kaybeder ve bunu
   FARK ETMEZ. O yuzden yalitimin kendisini olcuyoruz: bastan parmak izi
   aliyoruz, sonda karsilastiriyoruz. Degistiyse sinama BASARISIZ sayilir.
   ===================================================================== */
function depo_parmak_izi() {
  try {
    var a = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      a.push(k + '=' + (localStorage.getItem(k) || '').length);
    }
    return a.sort().join('|');
  } catch (e) {
    return 'ERISILEMEDI';   /* gizli sekme vb. — yazma da olamaz */
  }
}
var DEPO_BASLANGIC = depo_parmak_izi();

var satirlar = [], gecti = 0, kaldi = 0;
function yaz(s){ satirlar.push(s===undefined?'':s); }
function baslik(s){ yaz(''); yaz('=== ' + s + ' ==='); }
function dogrula(a, k){ if(k){gecti++; yaz('  [GECTI] '+a);} else {kaldi++; yaz('  [KALDI] '+a);} }
function tl(x){ return Number(x).toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL'; }

var C = window.Cekirdek, M = window.Mevzuat;
yaz('ARSA REHBERI — SUPURME SINAMASI   cekirdek ' + C.SURUM);

/* =====================================================================
   1. İKİ YÖNTEM AYRIŞMA SÜPÜRMESİ
   Kör nokta bir kez elle bulundu (%96 -> %6,6). Bu sefer sistematik:
   genis bir girdi kumesi uretip her birinde iki yontemi karsilastiriyoruz.
   %15'ten fazla ayrisan her girdi bir kor nokta ADAYIDIR.
   ===================================================================== */
baslik('1 — Iki yontem ayrisma supurmesi');

var TAM_HIZMET = {yol:1,su:1,elektrik:1,ulasim:1,cop:1,kanalizasyon:1,aydinlatma:1};

var SECENEKLER = {
    nitelik:        ['arsa', 'arsa_plansiz', 'arazi'],
    imar_fonksiyon: ['ticari', 'konut', 'sanayi', 'tarim'],
    kaks:           [0.20, 0.50, 1.00, 2.00, 4.00],
    yola_cephe:     ['kose', 'imar_yolu', 'kadastro', 'yok'],
    altyapi:        ['tam', 'kismi', 'yok'],
    konum:          ['merkez', 'orta', 'kenar', 'disi'],
    tapu_turu:      ['mustakil', 'hisseli', 'ifrazsiz'],
    egim_yuzde:     [5, 15, 25, 45],
    ada_ici_konum:  ['kose', 'bas', 'ara'],
    sekil:          ['dortgen', 'ucgen', 'cokgen'],
    zemin:          ['saglam', 'orta', 'sorunlu'],
    manzara:        [true, false]
};

/* Emsal: "standart iyi parsel" — arayuzun kullandigi varsayimin aynisi */
function emsal_kur() {
    return { birim_fiyat:1000, nitelik:'arsa', imar_fonksiyon:'konut', kaks:1.0,
             yola_cephe:'imar_yolu', altyapi:'tam', konum:'orta',
             tapu_turu:'mustakil', egim:'duz', geometri:'duzgun',
             hizmetler:TAM_HIZMET, deprem_bolgesi:3, zemin:'saglam',
             egim_yuzde:5, ada_ici_konum:'ara', sekil:'dortgen',
             baki:'guney', manzara:false, ana_cadde_m:100, merkez_m:500,
             egitim_m:300, yesil_alan_m:300, saglik_m:500 };
}

/* egim_yuzde -> carpan motorunun bekledigi kategori */
function egim_kategori(y){ return y<=10?'duz' : y<=20?'hafif' : 'dik'; }
function sekil_geometri(s){ return s==='dortgen'?'duzgun' : s==='cokgen'?'duzensiz' : 'dar'; }

/* Her faktoru tek tek degistirip supur (birebir tarama).
   Kombinasyon patlamasina girmiyoruz; kor nokta tek faktorde ortaya cikar. */
var denenen = 0, dusurulen = 0, ayrisan = [], bantGizleyen = [], enKotu = {ayrisma:-1};

Object.keys(SECENEKLER).forEach(function (anahtar) {
    SECENEKLER[anahtar].forEach(function (deger) {
        var h = emsal_kur();
        h.alan = 500;
        h[anahtar] = deger;
        if (anahtar === 'egim_yuzde') h.egim = egim_kategori(deger);
        if (anahtar === 'sekil')      h.geometri = sekil_geometri(deger);

        var an = C.deger_analizi(emsal_kur(), h);
        denenen++;
        if (an.hata) {
            ayrisan.push({anahtar:anahtar, deger:deger, ayrisma:'HATA'});
            return;
        }
        /* Nominal yontem gecerlilik alani disinda dusurulduyse bu bir hata
           degil, DOGRU davranis: sayi uretmek yerine yontemi birakiyoruz. */
        if (an.nominal_dusuruldu) { dusurulen++; return; }
        if (an.yontem_sayisi !== 2) {
            ayrisan.push({anahtar:anahtar, deger:deger, ayrisma:'TEK YONTEM'});
            return;
        }
        if (an.ayrisma_yuzde > enKotu.ayrisma) {
            enKotu = {ayrisma:an.ayrisma_yuzde, anahtar:anahtar, deger:deger,
                      c:an.yontemler.carpan, n:an.yontemler.nominal};
        }
        /* ASIL GUVENLIK OZELLIGI: bant, ayrismayi GIZLEMEMELI.
           Iki yontem %30 ayrismissa bant en az %30 olmali; yoksa kullanici
           olduğundan emin bir rakam gormus olur. */
        if (an.bant_yuzde + 0.05 < an.ayrisma_yuzde) {
            bantGizleyen.push({anahtar:anahtar, deger:deger,
                               ayrisma:an.ayrisma_yuzde, bant:an.bant_yuzde});
        }
        if (an.ayrisma_yuzde > 15) {
            ayrisan.push({anahtar:anahtar, deger:deger,
                          ayrisma:an.ayrisma_yuzde,
                          c:an.yontemler.carpan, n:an.yontemler.nominal});
        }
    });
});

yaz('  Denenen girdi        : ' + denenen);
yaz('  Gecerlilik disi (nominal dusuruldu): ' + dusurulen);
yaz('  %15 uzeri ayrisan    : ' + ayrisan.length);
yaz('  En kotu ayrisma      : %' + enKotu.ayrisma +
    '   (' + enKotu.anahtar + ' = ' + enKotu.deger + ')');
yaz('    -> carpan ' + enKotu.c + ' TL/m2  |  nominal ' + enKotu.n + ' TL/m2');
if (ayrisan.length) {
    yaz('');
    yaz('  AYRISAN GIRDILER (kor nokta adaylari):');
    ayrisan.forEach(function (a) {
        yaz('    %' + a.ayrisma + '  ' + a.anahtar + ' = ' + a.deger +
            (a.c !== undefined ? ('   carpan ' + a.c + ' / nominal ' + a.n) : ''));
    });
}
/* Yapisal ayrisma normaldir: carpan modeli carpar, nominal model ortalar.
   Yanlis olan ayrismak degil, ayrismayi SAKLAMAK olur. */
yaz('  Bandi ayrismadan DAR cikan girdi: ' + bantGizleyen.length);
if (bantGizleyen.length) {
    bantGizleyen.forEach(function (b) {
        yaz('    !! ' + b.anahtar + '=' + b.deger +
            '  ayrisma %' + b.ayrisma + ' ama bant %' + b.bant);
    });
}
dogrula('HICBIR girdide bant ayrismayi gizlemiyor', bantGizleyen.length === 0);
/* Yapisal ayrisma (carpan carpar / nominal ortalar) beklenen bir seydir ve
   bandin genislemesiyle karsilaniyor — asil guvenlik ozelligi yukarida
   olculdu. Buradaki esik sadece "bir sey cok fena kaydi mi" bekcisidir. */
dogrula('Gecerlilik alani icinde en kotu ayrisma %50 altinda', enKotu.ayrisma < 50);
dogrula('Gecerlilik alani disindaki girdiler yakalandi', dusurulen > 0);

/* Gecerlilik alani disinda SAYI URETILMEDIGINI dogrula */
var tarla = emsal_kur(); tarla.alan = 500; tarla.imar_fonksiyon = 'tarim';
var anT = C.deger_analizi(emsal_kur(), tarla);
dogrula('Tarim alaninda nominal yontem dusuruldu', anT.nominal_dusuruldu === true);
dogrula('Tek yontemde bant genisletildi', anT.bant_yuzde > 25);
dogrula('Kullaniciya sebep aciklaniyor',
        anT.guven_notu.indexOf('GECERLI DEGIL') !== -1);
dogrula('En az 40 girdi denendi', denenen >= 40);

/* =====================================================================
   2. VERGİ / HARÇ — ELLE HESAPLANMIŞ DOĞRULAMA
   Motorun cikitisini, elle yapilmis hesapla karsilastiriyoruz.
   ===================================================================== */
baslik('2 — Vergi ve harc hesaplarinin elle dogrulanmasi');

/* --- Tapu harci: binde 20 her taraf --- */
[[1750000, 35000], [640000, 12800], [12500000, 250000]].forEach(function (x) {
    var h = M.tapu_harci({beyan_bedeli:x[0]});
    dogrula('Tapu harci ' + tl(x[0]) + ' -> taraf basi ' + tl(x[1]),
            h.alici_harci === x[1] && h.satici_harci === x[1]);
});

/* --- Emlak vergisi: arsa binde 3 / buyuksehir binde 6 --- */
[[2400000, false, 7200], [2400000, true, 14400], [875000, true, 5250]].forEach(function (x) {
    var e = M.emlak_vergisi({vergi_degeri:x[0], tur:'arsa', buyuksehir:x[1]});
    dogrula('Emlak vergisi ' + tl(x[0]) + (x[1]?' (buyuksehir)':'') + ' -> ' + tl(x[2]),
            e.yillik_vergi === x[2]);
});

/* --- Deger artis kazanci: elle hesap ---
   satis 4.000.000 - alis 1.200.000 - gider 80.000 = safi 2.720.000
   matrah = 2.720.000 - 150.000 istisna = 2.570.000
   vergi  = 232.500 + (2.570.000 - 1.000.000) x 0,35 = 232.500 + 549.500 = 782.000 */
var d = M.deger_artis_kazanci({alis_bedeli:1200000, satis_bedeli:4000000,
        giderler:80000, alis_tarihi:'2023-05-10', satis_tarihi:'2026-08-26'});
yaz('  DAK safi ' + tl(d.safi_kazanc) + ' / matrah ' + tl(d.matrah) +
    ' / vergi ' + tl(d.vergi));
dogrula('DAK safi kazanc elle hesapla ayni (2.720.000)', d.safi_kazanc === 2720000);
dogrula('DAK matrah elle hesapla ayni (2.570.000)', d.matrah === 2570000);
dogrula('DAK vergi elle hesapla ayni (782.000)', d.vergi === 782000);

/* --- Insaat maliyeti: 1.240 m2 III-C = 1.240 x 23.400 --- */
var mm = M.insaat_maliyeti(1240, '3C');
dogrula('Insaat 1.240 m2 x 23.400 = 29.016.000', mm.kdv_haric === 29016000);

/* --- 2026 mevzuat oranlari yerinde mi --- */
dogrula('Tapu harci orani binde 20', M.TAPU_HARCI_ORANI === 0.020);
dogrula('DAK istisnasi 150.000 TL (2026)', M.DAK_ISTISNA === 150000);
dogrula('DAK suresi 5 yil', M.DAK_YIL_SINIRI === 5);
dogrula('Arsa emlak vergisi binde 3', M.EMLAK_VERGISI_ORANI.arsa.normal === 0.003);
dogrula('Mevzuat yili 2026', M.YIL === 2026);

/* =====================================================================
   3. UÇ DEĞERLER — "cokuyor mu" degil, "sessizce yanlis mi"
   ===================================================================== */
baslik('3 — Uc degerler: sessiz yanlis sayi var mi?');

/* --- Sifir ve negatif alan --- */
var s0 = C.imar_hesapla({alan:0, taks:0.3, kaks:1.5});
var sN = C.imar_hesapla({alan:-500, taks:0.3, kaks:1.5});
dogrula('Alan 0 -> sessizce sonuc uretmiyor, hata donuyor', !!s0.hata);
dogrula('Alan negatif -> hata donuyor, negatif insaat alani uretmiyor', !!sN.hata);

/* --- Negatif emsal fiyat --- */
var dNeg = C.deger_tahmini({birim_fiyat:-1000}, {alan:500});
dogrula('Negatif emsal fiyat -> hata donuyor', !!dNeg.hata);

/* --- Cok buyuk degerler --- */
var buyuk = C.imar_hesapla({alan:1000000, taks:0.4, kaks:3});
dogrula('1.000.000 m2 arsa -> 3.000.000 m2 insaat (dogru carpim)',
        buyuk.toplam_insaat_alani === 3000000);
var mBuyuk = M.insaat_maliyeti(3000000, '3A');
dogrula('3.000.000 m2 x 19.800 dogru hesaplaniyor',
        mBuyuk.kdv_haric === 59400000000);
dogrula('Buyuk sayida sonsuz/NaN uretmiyor', isFinite(mBuyuk.kdv_haric));

/* --- 1 m2 gibi ufak parsel --- */
var kucuk = C.imar_hesapla({alan:1, taks:0.3, kaks:1.5});
dogrula('1 m2 arsada daire sayisi 0 (yanlis pozitif yok)',
        kucuk.tahmini_daire_sayisi === 0);

/* --- KAKS 0 ve negatif --- */
dogrula('KAKS 0 -> carpan hesaplanamiyor (null)', C.DUZELTME.kaks.carpan(0) === null);
dogrula('KAKS negatif -> null', C.DUZELTME.kaks.carpan(-2) === null);

/* --- Metin girdisi sayi yerine --- */
var metin = C.deger_tahmini({birim_fiyat:'abc'}, {alan:500});
dogrula('Fiyat yerine metin -> hata donuyor', !!metin.hata);

/* --- TURKCE SAYI YAZIMI: en tehlikeli sessiz hata adayi ---
   Kullanici "1.500,50" yazarsa ne oluyor? Basit bir virgul->nokta
   donusumu "1.500.50" uretir ve parseFloat bunu 1,5 olarak okur.
   Yani 1.500 TL yerine 1,5 TL. Cokme yok, sadece 1000 kat yanlis sayi. */
function tr_sayi_basit(x){ return parseFloat(String(x).replace(',', '.')); }
yaz('  "1.500,50" basit donusumle -> ' + tr_sayi_basit('1.500,50'));
dogrula('TESPIT: basit virgul donusumu Turkce binlik ayracinda YANILIYOR',
        tr_sayi_basit('1.500,50') === 1.5);

/* Dogru donusum: once binlik noktalarini at, sonra virgulu noktaya cevir */
function tr_sayi(x) {
    if (typeof x === 'number') return isFinite(x) ? x : null;
    var m = String(x).trim().replace(/\s/g, '');
    if (!m) return null;
    /* Hem nokta hem virgul varsa: SONDAKI ondalik ayracidir */
    var sonNokta = m.lastIndexOf('.'), sonVirgul = m.lastIndexOf(',');
    if (sonNokta !== -1 && sonVirgul !== -1) {
        if (sonVirgul > sonNokta) m = m.replace(/\./g, '').replace(',', '.');
        else m = m.replace(/,/g, '');
    } else if (sonVirgul !== -1) {
        /* Sadece virgul: 2 haneden fazla varsa binlik ayracidir */
        var son = m.length - sonVirgul - 1;
        m = (son === 3 && m.indexOf(',') !== m.length - 4) || son > 2
            ? m.replace(/,/g, '') : m.replace(',', '.');
    } else if (sonNokta !== -1) {
        var sonN = m.length - sonNokta - 1;
        if (sonN === 3 && /^\d{1,3}(\.\d{3})+$/.test(m)) m = m.replace(/\./g, '');
    }
    var d = parseFloat(m);
    return isFinite(d) ? d : null;
}

[['1.500,50', 1500.5], ['1500,50', 1500.5], ['1500.50', 1500.5],
 ['2.800', 2800], ['2800', 2800], ['1.234.567', 1234567],
 ['12,5', 12.5], ['0,30', 0.30], ['  450 ', 450]].forEach(function (x) {
    var s = tr_sayi(x[0]);
    dogrula('Turkce sayi "' + x[0] + '" -> ' + x[1] + '  (cikan: ' + s + ')',
            Math.abs(s - x[1]) < 1e-9);
});

/* --- Nominal puan: bos girdi --- */
var np = C.nominal_puan({});
dogrula('Bos parselde nominal puan hata donuyor, 0 puan uretmiyor', !!np.hata);

/* --- Vasif: hicbir bilgi yoksa --- */
var vb = C.vasif_belirle({});
dogrula('Bos girdide vasif ARAZI diyor (guvenli taraf)', vb.kod === 'arazi');

/* --- Risk taramasi bos girdide cokmuyor --- */
var rb = C.risk_tara({});
dogrula('Bos girdide risk taramasi calisiyor', rb && rb.bulgular.length >= 1);

/* =====================================================================
   4. TUTARLILIK: ayni girdi iki kez -> ayni sonuc
   ===================================================================== */
baslik('4 — Tutarlilik');

var g1 = {alan:750, nitelik:'arsa', imar_fonksiyon:'konut', kaks:1.8,
          yola_cephe:'kose', altyapi:'tam', konum:'merkez', tapu_turu:'mustakil',
          egim:'duz', geometri:'duzgun', hizmetler:TAM_HIZMET, deprem_bolgesi:4,
          zemin:'saglam', egim_yuzde:5, ada_ici_konum:'kose', sekil:'dortgen',
          baki:'guney', manzara:true, ana_cadde_m:80, merkez_m:300,
          egitim_m:200, yesil_alan_m:150, saglik_m:400};
var a1 = C.deger_analizi(emsal_kur(), g1);
var a2 = C.deger_analizi(emsal_kur(), JSON.parse(JSON.stringify(g1)));
dogrula('Ayni girdi iki kez -> ayni birim fiyat',
        a1.birim_fiyat.orta === a2.birim_fiyat.orta);

/* Daha iyi parsel emsalden PAHALI cikmali */
yaz('  Iyi parsel (kose, merkez, manzarali, emsal 1,8): ' +
    tl(a1.birim_fiyat.orta) + '/m2  (emsal 1.000 TL)');
dogrula('Her yonden daha iyi parsel emsalden pahali', a1.birim_fiyat.orta > 1000);

/* Alan buyuyunce toplam deger dogrusal buyumeli */
var kucukP = C.deger_analizi(emsal_kur(), Object.assign({}, g1, {alan:100}));
var buyukP = C.deger_analizi(emsal_kur(), Object.assign({}, g1, {alan:1000}));
dogrula('Alan 10 kat -> toplam deger 10 kat',
        Math.abs(buyukP.toplam_deger.orta - kucukP.toplam_deger.orta * 10) < 20);


/* =====================================================================
   5. SIRALAMA DENETIMI — katsayilarimiz 50 uzmanla celisiyor mu?
   Buyuklugu denetleyemiyoruz (K8 betalari 2017 lirasi), ama SIRAYI
   denetleyebiliriz. Celiski varsa gercek bir bulgudur.
   ===================================================================== */
baslik('5 — Katsayi siralamasi uzman anketiyle uyumlu mu? (K9)');

var sd = C.siralama_denetimi();
yaz('  Karsilastirilan faktor: ' + sd.karsilastirilan);
yaz('');
yaz('  Faktor                     bizim etki araligi   uzman onemi');
sd.faktorler.forEach(function (f) {
    yaz('    ' + (f.ad + '                         ').slice(0, 26) +
        ' x' + f.aralik.toFixed(2) + '            ' + f.uzman_puan);
});
yaz('');
yaz('  Bizim sira : ' + sd.bizim_sira.join(' > '));
yaz('  Uzman sira : ' + sd.uzman_sira.join(' > '));
yaz('  Ters cift  : ' + sd.celiski.length);
sd.celiski.forEach(function (c) {
    yaz('    !! uzman "' + c.uzmana_gore_ustun + '" > "' + c.bize_gore_ustun +
        '" diyor, biz tersini soyluyoruz');
});

dogrula('En az 3 faktor karsilastirilabildi', sd.karsilastirilan >= 3);
dogrula('Uzmanlarla en fazla 1 ters cift var', sd.celiski.length <= 1);
dogrula('Uzmanlarin en onemli buldugu faktor (emsal) bizde de ilk ucte',
        sd.bizim_sira.indexOf('kaks') <= 2);

/* Kalibre edilen faktorler dogru etiketlendi mi? */
dogrula('Altyapi artik "kalibre" etiketli',
        C.DUZELTME.altyapi.guven === C.GUVEN.KALIBRE);
dogrula('Parsel sekli artik "kalibre" etiketli',
        C.DUZELTME.geometri.guven === C.GUVEN.KALIBRE);
dogrula('Kalibre etiketinin kullaniciya gorunen karsiligi var',
        !!C.GUVEN_ETIKET.kalibre);
dogrula('Kalibre, olculdu ile KARISTIRILMIYOR',
        C.GUVEN.KALIBRE !== C.GUVEN.OLCULDU);

/* Dayanagi olmayanlar hala dogru etiketli mi? */
dogrula('Hisseli tapu HALA tahmin (literaturde sayi yok)',
        C.DUZELTME.tapu_turu.guven === C.GUVEN.BASLANGIC);

var sayim = {mevzuat:0, olculdu:0, kalibre:0, baslangic:0};
C.FAKTOR_SIRASI.forEach(function (k) { sayim[C.DUZELTME[k].guven]++; });
yaz('');
yaz('  Katsayi guven dagilimi: olculdu ' + sayim.olculdu +
    ' / kalibre ' + sayim.kalibre + ' / tahmin ' + sayim.baslangic);
dogrula('Denetlenmis katsayi sayisi arttı (>=3)',
        sayim.olculdu + sayim.kalibre >= 3);

/* ------------------------------------------------------------------ */


/* =====================================================================
   6. BOLGE PROFILLERI — yayimlanmis agirlik setleri ne kadar ayrisiyor?
   ===================================================================== */
baslik('6 — Bolge profilleri (yayimlanmis agirlik setleri)');

var pe2 = emsal_kur();
var ph2 = emsal_kur(); ph2.alan = 500; ph2.merkez_m = 2500; ph2.egim_yuzde = 25;
var py = C.profil_yayilimi(pe2, ph2);

yaz('  Profil sayisi: ' + Object.keys(C.BOLGE_PROFILI).length);
py.profiller.forEach(function (x) {
    yaz('    ' + (x.profil_ad + '                                   ').slice(0, 44) +
        tl(x.birim_fiyat) + '/m2   [' + x.kaynak + ']');
});
yaz('  En az / en cok : ' + tl(py.en_az) + ' .. ' + tl(py.en_cok));
yaz('  Yayilim        : %' + py.yayilim_yuzde);

dogrula('En az 3 yayimlanmis profil tanimli',
        Object.keys(C.BOLGE_PROFILI).length >= 3);
dogrula('Her profilin ornek kumesi yazili',
        Object.keys(C.BOLGE_PROFILI).every(function (k) {
            return !!C.BOLGE_PROFILI[k].kume && !!C.BOLGE_PROFILI[k].kaynak;
        }));
dogrula('Profiller arasinda gercek fark olculuyor', py.yayilim_yuzde > 0);

/* EN KRITIK: agirliklar gecici degistiriliyor, GERI KONULUYOR mu?
   Konulmazsa bir sonraki hesap sessizce yanlis profille calisir. */
var oncePuan = C.nominal_puan(ph2).puan;
C.nominal_puan_profilli(ph2, 'avanos_m2');
var sonraPuan = C.nominal_puan(ph2).puan;
yaz('');
yaz('  Varsayilan puan once/sonra: ' + oncePuan + ' / ' + sonraPuan);
dogrula('Profil hesabi varsayilan agirliklari BOZMUYOR', oncePuan === sonraPuan);

/* Yayilim banda yansiyor mu? */
var anP = C.deger_analizi(pe2, ph2);
yaz('  Birlesik bant : %' + anP.bant_yuzde + '   (bolge yayilimi %' +
    (anP.bolge_yayilimi ? anP.bolge_yayilimi.yuzde : '-') + ')');
dogrula('Bolge yayilimi sonuca ekleniyor', !!anP.bolge_yayilimi);
dogrula('Bant, bolge yayilimini gizlemiyor',
        anP.bolge_yayilimi ? anP.bant_yuzde + 0.05 >= anP.bolge_yayilimi.yuzde : true);


/* =====================================================================
   7. SINIR DEGERLERI — ±1 birim sonucu sicratiyor mu?
   SINAMA-LISTESI A-12 ve D. Bu projede sinir hatasi = olmayan vergi.
   ===================================================================== */
baslik('7 — Sinir degerleri (vergi dilimi ve 5 yil kurali)');

/* --- Gelir vergisi dilim gecisleri: ±1 TL --- */
[[190000, 190001], [400000, 400001], [1000000, 1000001], [5300000, 5300001]]
.forEach(function (c) {
    var a = M.gelir_vergisi(c[0]), b = M.gelir_vergisi(c[1]);
    var fark = b - a;
    yaz('  ' + tl(c[0]) + ' -> ' + tl(c[1]) + '  vergi farki: ' + fark.toFixed(2) + ' TL');
    /* Dilim gecisinde vergi SICRAMAMALI; sadece ust dilimin orani uygulanir.
       Sicrama olursa kullanici 1 TL fazla kazandigi icin binlerce TL fazla
       vergi oder — klasik dilim hatasi. */
    dogrula('Dilim gecisinde 1 TL icin vergi sicramasi yok (' + c[0] + ')',
            fark >= 0 && fark < 1);
});
dogrula('Vergi hicbir yerde negatif degil', M.gelir_vergisi(0) === 0);

/* --- 5 YIL KURALI: bir gun hatasi = olmayan vergi --- */
yaz('');
yaz('  5 yil siniri (alis 15.03.2021):');
[['2026-03-14', true,  '1 gun eksik -> VERGI VAR'],
 ['2026-03-15', false, 'tam 5 yil    -> vergi yok'],
 ['2026-03-16', false, '1 gun fazla  -> vergi yok']
].forEach(function (x) {
    var d = M.deger_artis_kazanci({alis_bedeli:1000000, satis_bedeli:3000000,
             alis_tarihi:'2021-03-15', satis_tarihi:x[0]});
    yaz('    ' + x[0] + '  ' + x[2] + '   (motor: ' +
        (d.vergi_var_mi ? 'vergi var' : 'vergi yok') + ')');
    dogrula('5 yil siniri dogru: ' + x[2], d.vergi_var_mi === x[1]);
});

/* --- Artik yil ve ay sonu --- */
var artik = M.deger_artis_kazanci({alis_bedeli:1000000, satis_bedeli:2000000,
             alis_tarihi:'2020-02-29', satis_tarihi:'2025-02-28'});
yaz('  Artik gun (29.02.2020 -> 28.02.2025): ' +
    (artik.vergi_var_mi ? 'vergi var' : 'vergi yok') +
    '  (' + artik.elde_tutma_yili + ' yil)');
dogrula('Artik gun hesabi cokmuyor ve makul sonuc veriyor',
        artik.elde_tutma_yili > 4.9 && artik.elde_tutma_yili < 5.1);

/* --- Gecersiz tarih sessizce yutulmamali --- */
var kotuTarih = M.deger_artis_kazanci({alis_bedeli:1000000, satis_bedeli:2000000,
                 alis_tarihi:'abc', satis_tarihi:'2026-01-01'});
yaz('  Gecersiz tarih -> elde tutma: ' + kotuTarih.elde_tutma_yili);
dogrula('Gecersiz tarihte sure NULL, uydurma sayi uretilmiyor',
        kotuTarih.elde_tutma_yili === null);
dogrula('Sure bilinmiyorsa GUVENLI tarafta kaliniyor (vergi var sayiliyor)',
        kotuTarih.vergi_var_mi === true);

/* =====================================================================
   8. TURKCE SAYI — listedeki 9 yazimin TAMAMI
   SINAMA-LISTESI A-3. Ozellikle "1,500.50" (Ingilizce) ve "1 500".
   ===================================================================== */
baslik('8 — Listedeki 9 yazim bicimi (A-3)');

[['1500', 1500], ['1500.50', 1500.5], ['1500,50', 1500.5],
 ['1.500', 1500], ['1.500,50', 1500.5], ['1,500.50', 1500.5],
 ['1 500', 1500], ['1500 TL', 1500], [' 1500 ', 1500]
].forEach(function (x) {
    var s = C.sayi_oku(x[0]);
    dogrula('"' + x[0] + '" -> ' + x[1] + ' (cikan ' + s + ')',
            s !== null && Math.abs(s - x[1]) < 1e-9);
});

/* Listedeki YANLIS KURAL uyarisi: "virgul yoksa nokta ondaliktir" */
dogrula('YANLIS KURAL tuzagi: "1.500" 1,5 OKUNMUYOR', C.sayi_oku('1.500') !== 1.5);
dogrula('Ingilizce yazimda sondaki ondalik: "1,500.50" 1500,5',
        Math.abs(C.sayi_oku('1,500.50') - 1500.5) < 1e-9);

/* =====================================================================
   9. UC DEGERLER — uzun metin ve tasma (C bolumu)
   ===================================================================== */
baslik('9 — Uzun metin ve olcu tasmalari');

var uzunAd = 'Kahramanmaras Onikisubat Ilcesi Yenisehir Mahallesi Ataturk Bulvari ' +
             'Uzerindeki Kose Parsel Numara Kirk Uc Bolu Iki';
yaz('  Deneme metni: ' + uzunAd.length + ' harf');
var uzunSonuc = C.deger_analizi(emsal_kur(), Object.assign(emsal_kur(), {alan:500}));
dogrula('Uzun metin motoru etkilemiyor (motor metin almiyor)', !uzunSonuc.hata);

/* Cok buyuk alan + cok buyuk fiyat: sonsuz/NaN uretiyor mu? */
var devasa = C.deger_analizi({birim_fiyat: 999999999},
                             Object.assign(emsal_kur(), {alan: 9999999}));
yaz('  9.999.999 m2 x 999.999.999 TL/m2 -> ' +
    (devasa.toplam_deger ? devasa.toplam_deger.orta : '-'));
dogrula('Devasa girdide sonlu sayi uretiliyor',
        devasa.toplam_deger && isFinite(devasa.toplam_deger.orta));
dogrula('Devasa girdide sonuc pozitif',
        devasa.toplam_deger && devasa.toplam_deger.orta > 0);

/* Ondalik tasmasi */
dogrula('Cok ondalikli girdi kabul ediliyor',
        Math.abs(C.sayi_oku('1500,123456789') - 1500.123456789) < 1e-6);

/* --- YALITIM DENETIMI: sinama kullanicinin verisini bozdu mu? --- */
baslik('YALITIM — sinama gercek veriye dokundu mu?');
var DEPO_BITIS = depo_parmak_izi();
if (DEPO_BASLANGIC === 'ERISILEMEDI') {
  yaz('  localStorage erisilemiyor; yazma da mumkun degil.');
  dogrula('Depoya erisim yok, yazma riski yok', true);
} else {
  yaz('  Basta : ' + (DEPO_BASLANGIC || '(bos)'));
  yaz('  Sonda : ' + (DEPO_BITIS || '(bos)'));
  dogrula('Sinama kullanicinin localStorage verisini DEGISTIRMEDI',
          DEPO_BASLANGIC === DEPO_BITIS);
}

yaz('');
yaz('==================================================');
/* ═══════════════════════════════════════════════════════════════
   CEKIRDEK HAM METIN ALIRSA — 27.08.2026'da bulundu
   ---------------------------------------------------------------
   `cekirdek.js` icindeki yardimci `sayi()` sadece `Number(x)` idi:

       sayi("1.000")  ->  1        (1000 kat yanlis)

   Yani bu dosyada, kanonik `sayi_oku`dan 7 satir uzakta, onun
   cozdugu sorunu yeniden ureten ikinci bir cozumleyici duruyordu.
   Kullaniciya ulasmiyordu (arayuz.js kendi `sayi()`sini `sayi_oku`ya
   baglamis) ama cekirdek belgelenmis bir API ve bu sinama dosyasi
   onu DOGRUDAN cagiriyor. Arayuzun korumasi bir tercihti, sozlesme
   degildi.
   ═══════════════════════════════════════════════════════════════ */
yaz('');
yaz('--- Cekirdege ham metin verilirse ---');
(function () {
  var D = Cekirdek.DUZELTME, tam = {};
  Object.keys(D).forEach(function (a) {
    tam[a] = (D[a].tip === 'secenek') ? Object.keys(D[a].secenek)[0] : 1.5;
  });
  function toplam(alan) {
    var e = Object.assign({ birim_fiyat: 5000 }, tam);
    var h = Object.assign({}, tam, { alan: alan });
    var r = Cekirdek.deger_analizi(e, h);
    return (r && r.toplam_deger) ? r.toplam_deger.orta : null;
  }
  var sayiyla = toplam(1000);
  var metinle = toplam('1.000');
  yaz('  alan 1000 (sayi)   -> ' + sayiyla);
  yaz("  alan '1.000' (metin) -> " + metinle);
  dogrula('Turkce binlik ayraci cekirdekte de dogru okunuyor',
          metinle === sayiyla);
  dogrula("'1.500,50' cekirdekte 1500,5 okunuyor",
          Cekirdek.sayi_oku('1.500,50') === 1500.5);

  /* Oran alanlarinda ayrac HER ZAMAN ondalik olmalidir. */
  var imar = Cekirdek.imar_hesapla({ alan: 1000, taks: '0,300', kaks: '1,500' });
  yaz('  taks "0,300" kaks "1,500" -> taban ' +
      (imar.taban_alani || '-') + ' m2, insaat ' + (imar.toplam_insaat_alani || '-') + ' m2');
  dogrula('TAKS "0,300" 0,3 okunuyor (300 degil)',
          imar.taban_alani === 300);
  dogrula('KAKS "1,500" 1,5 okunuyor (1500 degil)',
          imar.toplam_insaat_alani === 1500);

  dogrula('Metin girdi ile sayi girdi ayni imar sonucunu veriyor',
          JSON.stringify(imar) ===
          JSON.stringify(Cekirdek.imar_hesapla({ alan: 1000, taks: 0.30, kaks: 1.50 })));

  /* Cozulemeyen deger sayi UYDURMAMALI. */
  dogrula('Cozulemeyen alan icin toplam deger uretilmiyor',
          toplam('abc') === null && toplam('') === null);
})();

yaz('');
/* ═══════════════════════════════════════════════════════════════
   MEVZUAT MODULU HAM METIN ALIRSA — 27.08.2026'da bulundu
   ---------------------------------------------------------------
   `mevzuat.js` girdileri `Number(...)` ile okuyordu. Olculdu:

       giderler: 500000    -> vergi 355.000 TL
       giderler: "500.000" -> vergi 529.825 TL     (gider 500 okundu)

   175.000 TL fark ve hata KULLANICININ ALEYHINE: gider dusuk okununca
   vergi yuksek cikiyor. `Number("1.000.000")` de 1 verdigi icin alis
   bedeli "gerekli" diye reddediliyordu.

   Arayuz bu modulu ham metinle cagirmiyor, ama `mevzuat.js` disa acik
   bir API ve BU DOSYA onu dogrudan cagiriyor. Cagiranin dikkatli olmasi
   bir tercihtir, sozlesme degil.
   ═══════════════════════════════════════════════════════════════ */
yaz('');
yaz('--- Mevzuat modulune ham metin verilirse ---');
(function () {
  var temel = { alis_bedeli: 1000000, satis_bedeli: 3000000,
                alis_tarihi: '2023-01-01', satis_tarihi: '2026-01-01' };
  function vergi(ek) { return Mevzuat.deger_artis_kazanci(Object.assign({}, temel, ek)); }

  var sayiyla = vergi({ giderler: 500000 });
  var metinle = vergi({ giderler: '500.000' });
  yaz('  gider 500000  -> vergi ' + sayiyla.vergi);
  yaz("  gider '500.000' -> vergi " + metinle.vergi);
  dogrula('Gider metinle de dogru okunuyor', metinle.giderler === 500000);
  dogrula('Metin ve sayi ayni vergiyi veriyor', metinle.vergi === sayiyla.vergi);

  var alisMetin = vergi({ alis_bedeli: '1.000.000' });
  dogrula('Alis bedeli metinle reddedilmiyor', !alisMetin.hata);
  dogrula('Alis bedeli metinle ayni sonucu veriyor',
          !alisMetin.hata && alisMetin.vergi === vergi({}).vergi);

  /* Cozulemeyen gider 0 sayilir (gider vermemek mesrudur) ama
     KULLANILAN deger sonuca yaziliyor; kullanici ne kabul edildigini gorur. */
  dogrula('Cozulemeyen gider 0 kabul ediliyor ve bildiriliyor',
          vergi({ giderler: 'abc' }).giderler === 0);

  var th1 = Mevzuat.tapu_harci({ beyan_bedeli: '2.000.000' }).alici_harci;
  var th2 = Mevzuat.tapu_harci({ beyan_bedeli: 2000000 }).alici_harci;
  yaz('  tapu harci: metin ' + th1 + ' | sayi ' + th2);
  dogrula('Tapu harci metinle de ayni', th1 === th2);
})();

yaz('');
yaz('  GECTI: ' + gecti + '    KALDI: ' + kaldi);
yaz('==================================================');

document.getElementById('cikti').textContent = satirlar.join('\n');
</script>
