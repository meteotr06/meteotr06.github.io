<!--
  BU SAYFA NEDEN YONLENDIRME OLDU (02.09.2026)
  ============================================
  Burada 18.07.2026 tarihli, tek dosyalik ESKI hava durumu uygulamasi
  duruyordu. Hicbir yerden baglanti verilmiyordu ama canlida 200 donuyor,
  yani adresi bilen ya da arama motorundan gelen herkes aciyordu.

  ASIL SORUN "eski" olmasi degildi -- YANLIS SAYI vermesiydi:
  ilcelerin bir kismi icin ILCE degil IL MERKEZI koordinati kullaniyordu.
  Olculdu (guncel mobil/yerler.js ile karsilastirilarak):

      Gulnar    36.8000, 34.6333  ->  dogrusu 36.3415, 33.3992   (~110 km)
      Midyat    37.3122, 40.7351  ->  dogrusu 37.4191, 41.3391   (~55 km)
      Ozvatan   38.7333, 35.4833  ->  dogrusu 39.1069, 35.6999   (~46 km)
      Oguzlar   40.5506, 34.9556  ->  dogrusu 40.7535, 34.7028   (~31 km)

  Yani sayfa Mersin'in havasini "Gulnar" diye gosteriyordu. Uygulama
  calisiyor, ekran doluyor, sayi YANLIS -- bu takimin en tehlikeli
  saydigi hata sinifi (K-22). Kullanicinin yanlis oldugunu anlamasinin
  hicbir yolu yok; hava durumu zaten "tahmin" oldugu icin tutmayan
  sonuc supheli bile gorunmez.

  NEDEN SILMEDIM: adresi yer imine eklemis biri olabilir. Silmek onu
  404'e dusururdu; yonlendirmek guncel uygulamaya goturur. Yanlis veri
  ortadan kalkar, baglanti yasar.

  noindex: arama motoru bu adresi dizinden dusursun, /mobil/ kalsin.
  follow : yonlendirme izlensin ki devir aktarilsin.

  ESKI SURUM SILINMEDI, git gecmisinde duruyor (b03e909, 18.07.2026).
-->
